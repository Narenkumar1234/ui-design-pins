<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F4D3A">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%231F4D3A%22/%3E%3Ccircle cx=%2225%22 cy=%2211%22 r=%223%22 fill=%22%23C6F35E%22/%3E%3C/svg%3E">
  <title>Orbit · Interviews</title>
</head>
<body data-page="interviews" class="antialiased">
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="min-w-0">
      <header id="topbar" class="sticky top-0 z-30 flex items-center gap-3 px-4 sm:px-6 lg:px-8 h-[72px] bg-bg/90 backdrop-blur border-b border-line lg:border-b-0"></header>
      <main id="main" class="px-4 sm:px-6 lg:px-8 pt-4 lg:pt-2 pb-32 lg:pb-12 max-w-[1440px]">
        <!-- Interviews: month calendar (prev / next / today, select a day), day agenda, upcoming list with .ics download, schedule form -->
        <div class="flex flex-wrap items-center gap-3 mb-5">
          <div class="flex-1 min-w-0 basis-full sm:basis-auto"><h1 class="font-display text-[30px] font-bold tracking-tight leading-tight">Interviews</h1><p id="int-sub" class="label">3 upcoming</p></div>
          <div class="flex items-center gap-2">
            <button type="button" class="btn-icon" id="prev" aria-label="Previous month"></button>
            <p id="month" class="font-display font-bold text-[18px] w-[140px] text-center" aria-live="polite">October 2026</p>
            <button type="button" class="btn-icon" id="next" aria-label="Next month"></button>
            <button type="button" class="btn btn-ghost" id="today-btn">Today</button>
          </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          <section class="card p-3 sm:p-4 lg:col-span-8 min-w-0" aria-label="Calendar">
            <div class="cal mb-1.5" aria-hidden="true"><p class="text-center text-[12px] font-semibold text-muted py-1">Mon</p><p class="text-center text-[12px] font-semibold text-muted py-1">Tue</p><p class="text-center text-[12px] font-semibold text-muted py-1">Wed</p><p class="text-center text-[12px] font-semibold text-muted py-1">Thu</p><p class="text-center text-[12px] font-semibold text-muted py-1">Fri</p><p class="text-center text-[12px] font-semibold text-muted py-1">Sat</p><p class="text-center text-[12px] font-semibold text-muted py-1">Sun</p></div>
            <div id="cal" class="cal" role="grid"></div>
          </section>
          <div class="lg:col-span-4 flex flex-col gap-4 min-w-0">
            <section class="card p-5" aria-labelledby="day-h"><h2 id="day-h" class="font-display text-[18px] font-bold">Sun 25 Oct</h2><ul id="day" class="mt-3 flex flex-col gap-2"></ul></section>
            <section class="card p-5" aria-labelledby="sch-h">
              <h2 id="sch-h" class="font-display text-[18px] font-bold">Schedule an interview</h2>
              <form id="sched" class="mt-3 flex flex-col gap-3" novalidate>
                <div class="field"><label for="s-app">Application</label><select id="s-app" class="select"></select></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2 gap-3"><div class="field min-w-0"><label for="s-at">Date + time</label><input id="s-at" type="datetime-local" class="input" required><p class="err">Pick a date</p></div>
                <div class="field min-w-0"><label for="s-kind">Round</label><select id="s-kind" class="select"><option>Recruiter call</option><option>Online assessment</option><option selected>Technical interview</option><option>System design round</option><option>HR round</option><option>Final round</option></select></div></div>
                <button type="submit" class="btn btn-primary">Save interview</button>
              </form>
            </section>
          </div>
        </div>
        <section class="card p-5 mt-4" aria-labelledby="list-h"><h2 id="list-h" class="font-display text-[18px] font-bold">All upcoming</h2><ul id="ilist" class="mt-3 grid sm:grid-cols-2 xl:grid-cols-3 gap-3"></ul></section>
      </main>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/interviews.js"></script>
</body>
</html>

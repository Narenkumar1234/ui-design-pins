<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F4D3A">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2215%22 fill=%22%231F4D3A%22/%3E%3Ccircle cx=%2225%22 cy=%2211%22 r=%223%22 fill=%22%23C6F35E%22/%3E%3C/svg%3E">
  <title>Orbit · Board</title>
</head>
<body data-page="board" class="antialiased">
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
    <div class="min-w-0">
      <header id="topbar" class="sticky top-0 z-30 flex items-center gap-3 px-4 sm:px-6 lg:px-8 h-[72px] bg-bg/90 backdrop-blur border-b border-line lg:border-b-0"></header>
      <main id="main" class="px-4 sm:px-6 lg:px-8 pt-4 lg:pt-2 pb-32 lg:pb-12 max-w-[1440px]">
        <!-- Board: kanban with drag-and-drop, Shift+Arrow keyboard moves, card menus, filters, sort, search (top bar) and CSV export -->
        <div class="flex flex-wrap items-center gap-3 mb-4">
          <div class="flex-1 min-w-0 basis-full sm:basis-auto"><h1 class="font-display text-[30px] font-bold tracking-tight leading-tight">Board</h1><p id="board-sub" class="label">17 applications</p></div>
          <select id="sort" class="select flex-1 sm:flex-none !w-auto !rounded-full !bg-card !h-[42px]" aria-label="Sort cards">
            <option value="manual">Sort: My order</option><option value="recent">Sort: Most recent</option><option value="company">Sort: Company A–Z</option><option value="salary">Sort: Highest pay</option>
          </select>
          <button type="button" class="btn btn-ghost" id="export">Export CSV</button>
        </div>
        <div class="flex flex-wrap items-center gap-2 mb-4" id="filters" role="group" aria-label="Filter">
          <button type="button" class="chip" data-f="all" aria-pressed="true">All</button>
          <button type="button" class="chip" data-f="Internship">Internship</button>
          <button type="button" class="chip" data-f="Full-time">Full-time</button>
          <button type="button" class="chip" data-f="Remote">Remote</button>
          <span id="filter-note" class="text-[12.5px] text-muted ml-1"></span>
          <p class="hidden xl:block ml-auto text-[12px] text-muted">Tip: drag cards, or focus one and press <kbd class="border border-line rounded px-1">Shift</kbd> + <kbd class="border border-line rounded px-1">←</kbd><kbd class="border border-line rounded px-1">→</kbd></p>
        </div>
        <div class="tabs md:hidden mb-3" id="tabs" role="tablist" aria-label="Status"></div>
        <div id="board" class="board" aria-describedby="kbd-help"></div>
        <p id="kbd-help" class="sr-only">Cards: press Enter to open, Shift plus Left or Right arrow to move to another column, Shift plus Up or Down to reorder, M for the move menu.</p>
        <div id="empty" class="hidden card p-10 text-center mt-2"><p class="font-display text-[20px] font-bold">No matching applications</p><p class="text-muted mt-1">Try another filter or clear the search.</p><button type="button" class="btn btn-ghost mt-4" id="clear-f">Clear filters</button></div>
      </main>
    </div>
  </div>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/board.js"></script>
</body>
</html>

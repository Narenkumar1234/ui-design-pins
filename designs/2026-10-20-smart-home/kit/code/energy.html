<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%23F2762E%22/%3E%3C/svg%3E">
  <title>Hearth · Energy</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-4 pb-32">
    <header class="flex items-center justify-between">
      <div>
        <p class="text-[13px] text-muted" id="range-label">This week</p>
        <h1 class="text-[34px] md:text-[44px] font-semibold leading-none tracking-[-0.02em] mt-1">Energy</h1>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle class="btn-round"></button>
        <button type="button" id="export" class="btn-round" aria-label="Download report"><svg class="icon text-[20px]"><use href="#i-arrowdown"/></svg></button>
      </div>
    </header>

    <div class="md:grid md:grid-cols-2 md:gap-6 md:items-start">
    <div>
    <!-- Day / Week / Month -->
    <div class="seg mt-5" role="tablist" aria-label="Range">
      <button type="button" role="tab" data-range="day">Day</button>
      <button type="button" role="tab" data-range="week">Week</button>
      <button type="button" role="tab" data-range="month">Month</button>
    </div>

    <!-- Usage card with bar chart -->
    <section class="bg-surface rounded-[24px] p-5 mt-4">
      <div class="flex items-start justify-between gap-3">
        <div>
          <p class="text-[44px] font-semibold leading-none tracking-[-0.03em]"><span id="total">142.6</span><span class="text-[18px] text-muted font-medium ml-1">kWh</span></p>
          <p class="text-[13px] text-muted mt-1.5">Est. cost <b class="text-ink font-medium" id="cost">₹1,141</b></p>
        </div>
        <span class="status !h-7 !px-3 !bg-primary/15 !text-deep" id="delta">-12% vs last week</span>
      </div>
      <div class="relative mt-5">
        <div id="tip" class="absolute -top-1 -translate-x-1/2 -translate-y-full bg-ink text-bg text-[12px] font-medium px-2.5 py-1 rounded-full whitespace-nowrap pointer-events-none transition-all"></div>
        <div id="bars" class="bars" role="group" aria-label="Usage per period"></div>
      </div>
    </section>

    <!-- Top devices -->
    <section class="mt-6">
      <div class="flex items-center justify-between"><h2 class="text-[20px] font-semibold">Top devices</h2><span class="text-[13px] text-muted" id="top-note">share of usage</span></div>
      <div id="top" class="bg-surface rounded-[24px] px-4 py-2 mt-3"></div>
    </section>
    </div>

    <!-- Scenes -->
    <section class="mt-6 md:mt-5" id="scenes">
      <div class="flex items-center justify-between"><h2 class="text-[20px] font-semibold">Scenes</h2><span class="text-[13px] text-muted" id="scene-note">Tap to run</span></div>
      <div id="scene-grid" class="grid grid-cols-2 gap-3 mt-3"></div>
    </section>
    </div>
  </main>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/energy.js"></script>
</body>
</html>

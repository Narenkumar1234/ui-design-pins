<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hearth - Smart Home</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Outfit Google Font -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              charcoal: '#1A1A1A',
              card: '#2A2A2A',
              raised: '#333333',
              ink: '#F5F2EE',
              muted: '#8C8782',
              accent: '#F2762E'
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Outfit", "sans-serif"],
            display: ["Outfit", "sans-serif"],
            body: ["Outfit", "sans-serif"],
            label: ["Outfit", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #1A1A1A;
      color: #F5F2EE;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#1A1A1A] min-h-screen text-[#F5F2EE] flex justify-center selection:bg-[#F2762E] selection:text-white pb-28">
<!-- Mobile Viewport Container (Target 390x844 bounds) -->
<main class="w-full max-w-[390px] min-h-screen relative flex flex-col px-5 pt-3">
<!-- TOP APP BAR (from Shared Component JSON specs) -->
<header class="flex justify-between items-center w-full pt-3 pb-2 max-w-md mx-auto">
<div class="flex items-center gap-3">
<!-- Leading Avatar -->
<div class="relative w-11 h-11 rounded-full overflow-hidden border border-[#333333] bg-[#2A2A2A] flex-shrink-0">
<img class="w-full h-full object-cover" data-alt="A portrait photograph of Aarav, a stylish modern homeowner with warm studio lighting and a clean aesthetic looking into the camera with an authentic confident smile, surrounded by soft interior ambiance." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBkqe8oIO0tGADzLsf5zYmgvCM8aVyupGDUK9zXAnFpCJHM-OjhrCv7r12DLVwpWTSVtVHryWoejLQz2LniIp-zbiJbmxbQunGghTmIrgVeXzuLobJgqeg1qsp0t5DEXW8JrndMe3PCuDlZpC7SWXsSFqQevSn4WGbD-vLijz43fktsu4DhYVkw6kazkHnXmtZeb95FeL-2KUW7yhL7LHbUi8whBnfpVKoFy4mVJDi5Dl0fvgsi4yFeivwxYlBaacJQTGrceYnqyR09"/>
</div>
<!-- Headings / Identity -->
<div class="flex flex-col">
<span class="text-sm font-medium text-[#F5F2EE] tracking-tight">Hi, Aarav</span>
<span class="font-headline font-bold text-xs text-[#F2762E]">Home, Chennai</span>
</div>
</div>
<!-- Trailing Action Button -->
<button aria-label="Notifications" class="w-11 h-11 rounded-full bg-[#2A2A2A] active:scale-95 transition-transform duration-150 flex items-center justify-center text-[#8C8782] hover:text-[#F5F2EE]">
<span class="material-symbols-outlined text-[20px]" data-icon="notifications">notifications</span>
</button>
</header>
<!-- HEADING & SEARCH SECTION -->
<section class="mt-4 flex flex-col gap-3.5">
<div class="flex items-baseline justify-between">
<h1 class="text-3xl font-headline font-bold text-[#F5F2EE] tracking-tight">My Home</h1>
<span class="text-xs font-medium text-[#8C8782] uppercase tracking-wider">Connected</span>
</div>
<!-- Full-round Pill Search Bar -->
<div class="relative flex items-center w-full">
<span class="material-symbols-outlined absolute left-4 text-[#8C8782] text-[20px] pointer-events-none" data-icon="search">search</span>
<input class="w-full bg-[#2A2A2A] text-[#F5F2EE] placeholder-[#8C8782] text-sm rounded-full pl-11 pr-4 py-3 focus:outline-none focus:ring-1 focus:ring-[#F2762E] transition-all border-none" placeholder="Search devices" type="text"/>
</div>
<!-- Quick Status / Ambient Line -->
<div class="flex items-center gap-2 text-xs text-[#8C8782] font-medium px-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-[#F2762E]" data-icon="thermostat">thermostat</span>
<span>24°C inside</span>
</div>
<span class="text-[#333333]">•</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[16px] text-[#F2762E]" data-icon="bolt">bolt</span>
<span>6.2 kWh today</span>
</div>
</div>
</section>
<!-- ROOM FILTER CHIPS -->
<section class="mt-4 overflow-x-auto no-scrollbar -mx-5 px-5">
<div class="flex items-center gap-2 w-max py-1">
<!-- Active Chip -->
<button class="bg-[#F2762E] text-[#F5F2EE] font-semibold text-xs px-5 py-2 rounded-full transition-transform active:scale-95 shadow-sm shadow-[#F2762E]/20">
          All
        </button>
<!-- Inactive Chips -->
<button class="bg-[#2A2A2A] hover:bg-[#333333] text-[#8C8782] hover:text-[#F5F2EE] font-medium text-xs px-4 py-2 rounded-full transition-all active:scale-95">
          Living room
        </button>
<button class="bg-[#2A2A2A] hover:bg-[#333333] text-[#8C8782] hover:text-[#F5F2EE] font-medium text-xs px-4 py-2 rounded-full transition-all active:scale-95">
          Bedroom
        </button>
<button class="bg-[#2A2A2A] hover:bg-[#333333] text-[#8C8782] hover:text-[#F5F2EE] font-medium text-xs px-4 py-2 rounded-full transition-all active:scale-95">
          Kitchen
        </button>
<button class="bg-[#2A2A2A] hover:bg-[#333333] text-[#8C8782] hover:text-[#F5F2EE] font-medium text-xs px-4 py-2 rounded-full transition-all active:scale-95">
          Balcony
        </button>
</div>
</section>
<!-- 2-COLUMN GRID OF DEVICE CARDS -->
<section class="mt-5 grid grid-cols-2 gap-3.5 pb-6">
<!-- CARD 1: Full Orange Accent Card (Living lights) -->
<div class="bg-[#F2762E] text-white rounded-[22px] p-4 flex flex-col justify-between h-[184px] shadow-lg shadow-[#F2762E]/25 transition-transform active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[22px]" data-icon="lightbulb">lightbulb</span>
</div>
<!-- Toggle ON switch -->
<button aria-label="Toggle Living Lights" class="w-11 h-6 bg-white/30 rounded-full p-0.5 flex items-center justify-end transition-colors">
<div class="w-5 h-5 rounded-full bg-white shadow-sm"></div>
</button>
</div>
<div>
<div class="inline-flex items-center px-2 py-0.5 rounded-full bg-white/25 text-[11px] font-medium tracking-wide mb-2 text-white">
            On
          </div>
<h3 class="font-headline font-bold text-base text-white leading-tight">Living lights</h3>
<p class="text-xs text-white/80 font-normal mt-0.5">4 lamps</p>
</div>
</div>
<!-- CARD 2: Air Conditioner -->
<div class="bg-[#2A2A2A] rounded-[22px] p-4 flex flex-col justify-between h-[184px] border border-transparent hover:border-[#333333] transition-all active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-[#333333] flex items-center justify-center text-[#F5F2EE]">
<span class="material-symbols-outlined text-[22px]" data-icon="mode_fan">mode_fan</span>
</div>
<!-- Toggle ON switch -->
<button aria-label="Toggle Air Conditioner" class="w-11 h-6 bg-[#F2762E] rounded-full p-0.5 flex items-center justify-end transition-colors">
<div class="w-5 h-5 rounded-full bg-[#F5F2EE] shadow-sm"></div>
</button>
</div>
<div>
<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#333333] text-[11px] font-medium text-[#F5F2EE] mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-[#F2762E]"></span>
<span>On</span>
</div>
<h3 class="font-headline font-semibold text-base text-[#F5F2EE] leading-tight">Air conditioner</h3>
<p class="text-xs text-[#8C8782] font-normal mt-0.5">22°C • Auto</p>
</div>
</div>
<!-- CARD 3: Smart TV -->
<div class="bg-[#2A2A2A] rounded-[22px] p-4 flex flex-col justify-between h-[184px] border border-transparent hover:border-[#333333] transition-all active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-[#333333] flex items-center justify-center text-[#8C8782]">
<span class="material-symbols-outlined text-[22px]" data-icon="tv">tv</span>
</div>
<!-- Toggle OFF switch -->
<button aria-label="Toggle Smart TV" class="w-11 h-6 bg-[#333333] rounded-full p-0.5 flex items-center justify-start transition-colors">
<div class="w-5 h-5 rounded-full bg-[#8C8782] shadow-sm"></div>
</button>
</div>
<div>
<div class="inline-flex items-center px-2 py-0.5 rounded-full bg-[#333333] text-[11px] font-medium text-[#8C8782] mb-2">
            Off
          </div>
<h3 class="font-headline font-semibold text-base text-[#F5F2EE] leading-tight">Smart TV</h3>
<p class="text-xs text-[#8C8782] font-normal mt-0.5">Off</p>
</div>
</div>
<!-- CARD 4: Wi-Fi Router -->
<div class="bg-[#2A2A2A] rounded-[22px] p-4 flex flex-col justify-between h-[184px] border border-transparent hover:border-[#333333] transition-all active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-[#333333] flex items-center justify-center text-[#F5F2EE]">
<span class="material-symbols-outlined text-[22px]" data-icon="router">router</span>
</div>
<!-- Toggle ON switch -->
<button aria-label="Toggle Router" class="w-11 h-6 bg-[#F2762E] rounded-full p-0.5 flex items-center justify-end transition-colors">
<div class="w-5 h-5 rounded-full bg-[#F5F2EE] shadow-sm"></div>
</button>
</div>
<div>
<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#333333] text-[11px] font-medium text-[#F5F2EE] mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-[#F2762E]"></span>
<span>Online</span>
</div>
<h3 class="font-headline font-semibold text-base text-[#F5F2EE] leading-tight">Wi-Fi router</h3>
<p class="text-xs text-[#8C8782] font-normal mt-0.5">8 devices</p>
</div>
</div>
</section>
<!-- FLOATING ROUNDED BOTTOM NAVIGATION BAR (from Shared Component JSON specs) -->
<nav class="fixed bottom-0 left-0 right-0 z-50 flex justify-around items-center px-4 py-3 bg-[#2A2A2A] rounded-full mx-auto w-[90%] max-w-sm mb-6 shadow-2xl shadow-black/40">
<!-- 1. Home (Active destination as per logic) -->
<a aria-label="Home" class="flex items-center justify-center text-[#F2762E] p-2 active:scale-90 transition-transform duration-200" href="#home">
<span class="material-symbols-outlined text-[22px] fill" data-icon="home" data-weight="fill">home</span>
</a>
<!-- 2. Rooms / Tune -->
<a aria-label="Rooms" class="flex items-center justify-center text-[#8C8782] hover:text-[#F5F2EE] p-2 active:scale-90 transition-transform duration-200" href="#rooms">
<span class="material-symbols-outlined text-[22px]" data-icon="tune">tune</span>
</a>
<!-- 3. Centered Orange Floating Action Button (+) -->
<button aria-label="Add device" class="w-11 h-11 bg-[#F2762E] hover:bg-[#ff853f] text-[#F5F2EE] rounded-full flex items-center justify-center shadow-lg shadow-[#F2762E]/30 active:scale-90 transition-transform duration-200 -my-1">
<span class="material-symbols-outlined text-[24px] font-semibold text-white" data-icon="add">add</span>
</button>
<!-- 4. Energy / Schedule -->
<a aria-label="Schedule" class="flex items-center justify-center text-[#8C8782] hover:text-[#F5F2EE] p-2 active:scale-90 transition-transform duration-200" href="#schedule">
<span class="material-symbols-outlined text-[22px]" data-icon="schedule">schedule</span>
</a>
<!-- 5. Settings -->
<a aria-label="Settings" class="flex items-center justify-center text-[#8C8782] hover:text-[#F5F2EE] p-2 active:scale-90 transition-transform duration-200" href="#settings">
<span class="material-symbols-outlined text-[22px]" data-icon="settings">settings</span>
</a>
</nav>
</main>
<script>
    // Lightweight micro-interaction script for toggles
    document.querySelectorAll('button[aria-label^="Toggle"]').forEach(toggle => {
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const knob = toggle.querySelector('div');
        const isAcCard = toggle.closest('.bg-\\[\\#F2762E\\]');
        
        if (toggle.classList.contains('justify-end')) {
          // Turn OFF
          toggle.classList.remove('justify-end');
          toggle.classList.add('justify-start');
          if (!isAcCard) {
            toggle.classList.remove('bg-[#F2762E]');
            toggle.classList.add('bg-[#333333]');
            knob.classList.remove('bg-[#F5F2EE]');
            knob.classList.add('bg-[#8C8782]');
          }
        } else {
          // Turn ON
          toggle.classList.remove('justify-start');
          toggle.classList.add('justify-end');
          if (!isAcCard) {
            toggle.classList.remove('bg-[#333333]');
            toggle.classList.add('bg-[#F2762E]');
            knob.classList.remove('bg-[#8C8782]');
            knob.classList.add('bg-[#F5F2EE]');
          }
        }
      });
    });
  </script>
</body></html>

        rgba(26, 26, 26, 0.0) 25%,
        rgba(26, 26, 26, 0.45) 55%,

<!-- Organic Scrim Shadow Fade -->

<!-- Top Status & App Bar Overlay Component -->

<span class="font-headline font-bold text-stone-100 text-lg tracking-tight lowercase">hearth</span>
</div>
<!-- Trailing Action: Skip -->

<div class="absolute bottom-6 left-6 z-10 flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#2A2A2A]/70 backdrop-blur-md border border-white/10 shadow-lg">
<span class="relative flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#F2762E] opacity-75"></span>

</span>
<span class="text-xs font-medium text-[#F5F2EE] tracking-wide">Evening Ambient • 22.5°C</span>
</div>
</div>

<div class="relative w-full h-[42%] px-7 pb-8 pt-2 flex flex-col justify-between bg-[#1A1A1A] z-20">
<!-- Content Stack -->

<!-- Inactive Dots (Muted Dark) -->

<!-- Bottom Interactive Pill Action: Drag / Slider Button -->
<div class="pt-2">
<div class="slider-track relative w-full h-[68px] bg-[#2A2A2A] rounded-full p-2 border border-[#333333] flex items-center justify-between shadow-xl overflow-hidden cursor-pointer" id="sliderTrack">
<!-- Center Off-white typography label -->

              Get Started
            </span>

<!-- Circular Vivid Orange Knob -->
<div class="relative z-10 w-[52px] h-[52px] rounded-full bg-[#F2762E] flex items-center justify-center shadow-lg transform transition-transform duration-75 active:scale-95 touch-none" id="sliderKnob">
<svg class="w-6 h-6 text-[#F5F2EE]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
<line x1="12" x2="12" y1="2" y2="12"></line>
</svg>
</div>
<!-- Trailing Double Chevron Indicators -->
<div class="relative z-0 pr-4 flex items-center gap-0.5 text-[#8C8782] pointer-events-none">
<svg class="w-5 h-5 text-[#8C8782]/70 animate-pulse" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<svg class="w-5 h-5 -ml-3 text-[#F2762E]/90 animate-pulse" fill="none" stroke="currentColor" stroke-width="2.2" style="animation-delay: 200ms;" viewbox="0 0 24 24">
<path d="m8.25 4.5 7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Subtle Home Indicator Bar -->
<div class="w-32 h-1 bg-[#333333] rounded-full mx-auto mt-4 opacity-70"></div>
</div>
</div>
</main>
<!-- Interactive Slide-to-unlock micro-script -->
<script>
    (function initSlider() {
      const knob = document.getElementById('sliderKnob');
      const track = document.getElementById('sliderTrack');
      const label = document.getElementById('sliderLabel');
      
      let isDragging = false;
      let startX = 0;
      let currentX = 0;
      let maxTravel = 0;

      function updateBounds() {
        const trackWidth = track.clientWidth;
        const knobWidth = knob.clientWidth;
        // Total distance knob can move (track width - knob - margins)
        maxTravel = trackWidth - knobWidth - 16;
      }

      window.addEventListener('resize', updateBounds);
      updateBounds();

      // Touch Events
      knob.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX - currentX;
        knob.style.transition = 'none';
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const x = e.touches[0].clientX - startX;
        currentX = Math.max(0, Math.min(x, maxTravel));
        knob.style.transform = `translateX(${currentX}px)`;
        
        // Fade label as knob slides over
        const opacity = Math.max(0, 1 - (currentX / (maxTravel * 0.7)));
        label.style.opacity = opacity;

        if (currentX >= maxTravel - 5) {
          triggerSuccess();
        }
      }, { passive: true });

      window.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        resetKnob();
      });

      // Mouse Events for Desktop Testing
      knob.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - currentX;
        knob.style.transition = 'none';
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const x = e.clientX - startX;
        currentX = Math.max(0, Math.min(x, maxTravel));
        knob.style.transform = `translateX(${currentX}px)`;
        
        const opacity = Math.max(0, 1 - (currentX / (maxTravel * 0.7)));
        label.style.opacity = opacity;

        if (currentX >= maxTravel - 5) {
          triggerSuccess();
        }
      });

      window.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        resetKnob();
      });

      // Direct Track Click convenience
      track.addEventListener('click', (e) => {
        if (e.target !== knob && !knob.contains(e.target)) {
          triggerSuccess();
        }
      });

      function resetKnob() {
        knob.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1)';
        knob.style.transform = 'translateX(0px)';
        label.style.opacity = '1';
        currentX = 0;
      }

      function triggerSuccess() {
        isDragging = false;
        knob.style.transition = 'transform 0.2s ease-out';
        knob.style.transform = `translateX(${maxTravel}px)`;
        label.innerText = 'Connected';
        label.style.opacity = '1';
        label.style.color = '#F2762E';
        
        setTimeout(() => {
          resetKnob();
          label.innerText = 'Get Started';
          label.style.color = '#F5F2EE';
        }, 1200);
      }
    })();
  </script>
</body></html>

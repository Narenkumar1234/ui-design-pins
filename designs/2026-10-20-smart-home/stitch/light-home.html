<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Hearth - Smart Home</title>
<!-- Google Fonts: Public Sans / Outfit -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            hearth: {
              bg: '#F5F2EE',
              card: '#FFFFFF',
              raised: '#ECE7E1',
              ink: '#1A1A1A',
              muted: '#8C8782',
              accent: '#F2762E'
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Outfit", "Public Sans", "sans-serif"],
            display: ["Outfit", "Public Sans", "sans-serif"],
            body: ["Outfit", "Public Sans", "sans-serif"],
            label: ["Outfit", "Public Sans", "sans-serif"]
          }
        },
      }
    }
  </script>
<style>
    body {
      background-color: #F5F2EE;
      color: #1A1A1A;
      font-family: 'Outfit', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#F5F2EE] min-h-screen text-[#1A1A1A] antialiased flex justify-center selection:bg-[#F2762E] selection:text-white">
<!-- Mobile Screen Container (390px x 844px context) -->
<div class="w-full max-w-[390px] min-h-screen flex flex-col relative pb-32 pt-2 px-5 bg-[#F5F2EE]">
<!-- 1. Top Bar -->
<header class="flex justify-between items-center w-full px-1 py-4 max-w-md mx-auto">
<div class="flex items-center gap-3">
<!-- Avatar -->
<div class="relative w-11 h-11 rounded-full overflow-hidden border border-[#ECE7E1] shadow-sm">
<img class="w-full h-full object-cover" data-alt="A refined candid portrait of Aarav, a young creative professional with a warm smile, styled in modern minimalist attire, standing in a brightly lit warm neutral studio setting with natural ambient morning light and architectural shadows." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBamyHCzJ4kdnuRTxFDPCSVODIke6ztApvRhuut4qQn8qj1uG7kxYtYH8O1JRb9DuUwnqF-Bkw82nULnbbBclx2Rt6_rFdMjh56_YxPKRwJaiHA9qsNmZN6jhjWkrYy0JIs-JyXoPgoWb0wWIUiYR7182GVMdZmHtsv16fickL9DQFXQxfKqkhlyRCj4GUxfejT6gDkccR5-0kFsSCQh2LE82l2--o5SW23rQELvI3nZhuqfxP51peddj4b5XCvEZhpc94ad4MqgVfb"/>
</div>
<!-- Greeting -->
<div class="flex flex-col">
<span class="font-headline text-base font-bold text-[#1A1A1A] leading-tight">Hi, Aarav</span>
<span class="font-label text-xs font-semibold text-[#F2762E] tracking-normal flex items-center gap-0.5">
            Home, Chennai
          </span>
</div>
</div>
<!-- Action Button / Notification Bell -->
<button aria-label="Notifications" class="w-10 h-10 rounded-full bg-[#ECE7E1] flex items-center justify-center text-[#1A1A1A] active:scale-95 transition-transform duration-150 shadow-sm hover:bg-[#E3DDCF]" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="notifications">notifications</span>
</button>
</header>
<!-- 2. Heading & Search & Status -->
<section class="mt-2 space-y-3.5">
<!-- Big Heading & Status indicator -->
<div class="flex justify-between items-baseline">
<h1 class="font-headline text-3xl font-bold tracking-tight text-[#1A1A1A]">My Home</h1>
<div class="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-[#ECE7E1]/80 text-[#8C8782] text-xs font-medium">
<span class="w-2 h-2 rounded-full bg-[#F2762E] animate-pulse"></span>
<span>Armed</span>
</div>
</div>
<!-- Search Bar -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-[#8C8782]">
<span class="material-symbols-outlined text-[20px]" data-icon="search">search</span>
</div>
<input class="w-full pl-10 pr-4 py-2.5 bg-white border border-[#ECE7E1] rounded-full text-sm placeholder-[#8C8782] text-[#1A1A1A] focus:outline-none focus:ring-1 focus:ring-[#F2762E] focus:border-[#F2762E] shadow-sm transition-all" placeholder="Search devices" type="text"/>
</div>
<!-- Weather & Energy Metrics Strip -->
<div class="flex items-center gap-4 text-xs font-medium text-[#8C8782] px-1">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[17px] text-[#F2762E]" data-icon="thermostat">thermostat</span>
<span>24°C inside</span>
</div>
<span class="text-[#ECE7E1] font-bold">·</span>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-[17px] text-[#F2762E]" data-icon="bolt">bolt</span>
<span>6.2 kWh today</span>
</div>
</div>
</section>
<!-- 3. Room Filter Chips -->
<nav aria-label="Room filters" class="mt-5 -mx-5 px-5 flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
<!-- Active Chip -->
<button class="px-5 py-2 rounded-full bg-[#F2762E] text-white font-semibold text-xs whitespace-nowrap active:scale-95 transition-transform duration-150 shadow-sm shadow-[#F2762E]/20">
        All
      </button>
<button class="px-5 py-2 rounded-full bg-[#ECE7E1] text-[#1A1A1A] font-medium text-xs whitespace-nowrap hover:bg-[#E3DDCF] active:scale-95 transition-all">
        Living room
      </button>
<button class="px-5 py-2 rounded-full bg-[#ECE7E1] text-[#1A1A1A] font-medium text-xs whitespace-nowrap hover:bg-[#E3DDCF] active:scale-95 transition-all">
        Bedroom
      </button>
<button class="px-5 py-2 rounded-full bg-[#ECE7E1] text-[#1A1A1A] font-medium text-xs whitespace-nowrap hover:bg-[#E3DDCF] active:scale-95 transition-all">
        Kitchen
      </button>
<button class="px-5 py-2 rounded-full bg-[#ECE7E1] text-[#1A1A1A] font-medium text-xs whitespace-nowrap hover:bg-[#E3DDCF] active:scale-95 transition-all">
        Balcony
      </button>
</nav>
<!-- 4. 2-Column Grid of Device Cards -->
<main class="mt-5 grid grid-cols-2 gap-3.5 flex-1">
<!-- Card 1: Living lights (FULL ORANGE CARD) -->
<div class="bg-[#F2762E] rounded-[22px] p-4 text-white flex flex-col justify-between shadow-lg shadow-[#F2762E]/20 min-h-[178px] transition-transform active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center backdrop-blur-sm">
<span class="material-symbols-outlined text-[22px] text-white" data-icon="lightbulb">lightbulb</span>
</div>
<!-- Toggle ON (White on orange) -->
<div class="w-11 h-6 bg-white rounded-full p-0.5 cursor-pointer flex items-center justify-end shadow-inner">
<div class="w-5 h-5 rounded-full bg-[#F2762E] shadow-sm transform transition-transform"></div>
</div>
</div>
<div class="mt-4">
<div class="inline-block px-2.5 py-0.5 rounded-full bg-white/20 text-[10px] font-semibold uppercase tracking-wider mb-2 text-white">
            On
          </div>
<h3 class="font-headline font-bold text-base leading-snug">Living lights</h3>
<p class="text-xs text-white/80 font-normal mt-0.5">4 lamps</p>
</div>
</div>
<!-- Card 2: Air conditioner (White Card) -->
<div class="bg-white rounded-[22px] p-4 border border-[#ECE7E1] flex flex-col justify-between shadow-sm min-h-[178px] transition-transform active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-[#ECE7E1] flex items-center justify-center text-[#1A1A1A]">
<span class="material-symbols-outlined text-[22px]" data-icon="mode_fan">mode_fan</span>
</div>
<!-- Toggle ON (Orange track) -->
<div class="w-11 h-6 bg-[#F2762E] rounded-full p-0.5 cursor-pointer flex items-center justify-end">
<div class="w-5 h-5 rounded-full bg-white shadow-sm transform transition-transform"></div>
</div>
</div>
<div class="mt-4">
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#ECE7E1] text-[10px] font-semibold text-[#1A1A1A] mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-[#F2762E]"></span>
<span>On</span>
</div>
<h3 class="font-headline font-bold text-base leading-snug text-[#1A1A1A]">Air conditioner</h3>
<p class="text-xs text-[#8C8782] font-normal mt-0.5">22°C · Auto</p>
</div>
</div>
<!-- Card 3: Smart TV (White Card) -->
<div class="bg-white rounded-[22px] p-4 border border-[#ECE7E1] flex flex-col justify-between shadow-sm min-h-[178px] transition-transform active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-[#ECE7E1] flex items-center justify-center text-[#8C8782]">
<span class="material-symbols-outlined text-[22px]" data-icon="tv">tv</span>
</div>
<!-- Toggle OFF (Muted Grey Track) -->
<div class="w-11 h-6 bg-[#ECE7E1] rounded-full p-0.5 cursor-pointer flex items-center justify-start">
<div class="w-5 h-5 rounded-full bg-white shadow-sm transform transition-transform"></div>
</div>
</div>
<div class="mt-4">
<div class="inline-block px-2.5 py-0.5 rounded-full bg-[#ECE7E1] text-[10px] font-semibold text-[#8C8782] mb-2">
            Off
          </div>
<h3 class="font-headline font-bold text-base leading-snug text-[#1A1A1A]">Smart TV</h3>
<p class="text-xs text-[#8C8782] font-normal mt-0.5">Standby</p>
</div>
</div>
<!-- Card 4: Wi-Fi router (White Card) -->
<div class="bg-white rounded-[22px] p-4 border border-[#ECE7E1] flex flex-col justify-between shadow-sm min-h-[178px] transition-transform active:scale-[0.98]">
<div class="flex items-start justify-between">
<div class="w-10 h-10 rounded-full bg-[#ECE7E1] flex items-center justify-center text-[#1A1A1A]">
<span class="material-symbols-outlined text-[22px]" data-icon="router">router</span>
</div>
<!-- Toggle ON (Orange track) -->
<div class="w-11 h-6 bg-[#F2762E] rounded-full p-0.5 cursor-pointer flex items-center justify-end">
<div class="w-5 h-5 rounded-full bg-white shadow-sm transform transition-transform"></div>
</div>
</div>
<div class="mt-4">
<div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#ECE7E1] text-[10px] font-semibold text-[#1A1A1A] mb-2">
<span class="w-1.5 h-1.5 rounded-full bg-[#F2762E]"></span>
<span>Online</span>
</div>
<h3 class="font-headline font-bold text-base leading-snug text-[#1A1A1A]">Wi-Fi router</h3>
<p class="text-xs text-[#8C8782] font-normal mt-0.5">8 devices</p>
</div>
</div>
</main>
<!-- 5. Floating Bottom Navigation Bar with Centered + FAB -->
<!-- Adhering strictly to Shared Component BottomNavBar JSON + design requirement specs -->
<nav class="fixed bottom-6 inset-x-4 max-w-[350px] mx-auto z-50 bg-white/95 backdrop-blur-md rounded-full shadow-xl shadow-neutral-900/10 px-3 py-2 flex items-center justify-between border border-[#ECE7E1]/60">
<!-- Home (Active: #F2762E) -->
<button aria-label="Home" class="flex items-center justify-center text-[#F2762E] p-2.5 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<!-- Rooms / Grid View -->
<button aria-label="Rooms" class="flex items-center justify-center text-[#8C8782] hover:text-[#1A1A1A] p-2.5 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]" data-icon="grid_view">grid_view</span>
</button>
<!-- Centered Raised Orange FAB (+) -->
<div class="relative -my-5 px-1">
<button aria-label="Add Device" class="w-12 h-12 rounded-full bg-[#F2762E] text-white flex items-center justify-center shadow-lg shadow-[#F2762E]/35 active:scale-90 transition-transform duration-150">
<span class="material-symbols-outlined text-[26px] font-bold" data-icon="add">add</span>
</button>
</div>
<!-- Energy / Bolt -->
<button aria-label="Energy" class="flex items-center justify-center text-[#8C8782] hover:text-[#1A1A1A] p-2.5 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]" data-icon="bolt">bolt</span>
</button>
<!-- Settings -->
<button aria-label="Settings" class="flex items-center justify-center text-[#8C8782] hover:text-[#1A1A1A] p-2.5 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined text-[24px]" data-icon="settings">settings</span>
</button>
</nav>
</div>
</body></html>

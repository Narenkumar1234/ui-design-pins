<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;background:#FAFAF7;font-family:Inter,sans-serif;color:#17181C;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased}
.top{position:absolute;top:84px;left:0;right:0;text-align:center;font:500 17px Inter;letter-spacing:4px;text-transform:uppercase;color:#6E6F76}
.top i{display:inline-block;width:28px;height:1px;background:#D9D6CE;vertical-align:middle;margin:0 12px}
.wrap{position:absolute;left:110px;right:110px;top:375px;text-align:center}
.kicker{display:inline-block;font:600 16px Inter;letter-spacing:3px;text-transform:uppercase;color:#1F7A5A;border:1px solid #1F7A5A;border-radius:999px;padding:10px 20px}
h1{font:700 84px/1.08 Manrope,sans-serif;letter-spacing:-3px;margin-top:40px}
h1 em{font-style:normal;color:#FFFFFF;background:#1F7A5A;border-radius:22px;padding:0 26px 6px;display:inline-block;margin:10px 0}
.line{width:64px;height:1px;background:#D9D6CE;margin:48px auto}
.teaser{font:400 27px/1.5 Inter;color:#6E6F76}
.teaser b{color:#17181C;font-weight:600}
.bits{margin-top:44px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.bit{font:500 17px Inter;padding:11px 20px;border:1px solid #ECEAE4;border-radius:999px;background:#FFFFFF;color:#17181C}
.foot{position:absolute;left:110px;right:110px;bottom:70px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ECEAE4;padding-top:26px}
.handle{font:700 28px Manrope,sans-serif;letter-spacing:-.3px}
.handle b{color:#1F7A5A}
.save{font:400 19px Inter;color:#6E6F76}
</style></head><body>
<div class="top"><i></i>Penny Budget App UI<i></i></div>
<div class="wrap">
  <div class="kicker">UI kit · code included</div>
  <h1>Comment <em>PENNY</em><br>to get the HTML/CSS</h1>
  <div class="line"></div>
  <p class="teaser"><b>Penny</b> · minimalist expense tracker<br>3 screens · light &amp; dark · working budget &amp; insights</p>
  <div class="bits">
    <span class="bit">HTML + Tailwind</span>
    <span class="bit">Vanilla JS</span>
    <span class="bit">localStorage</span>
    <span class="bit">Dark mode</span>
  </div>
</div>
<div class="foot"><span class="handle">@code.in.30s</span><span class="save">Save for your next project ↗</span></div>
</body></html>

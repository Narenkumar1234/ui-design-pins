<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2746%27 fill=%27%231F7A5A%27/%3E%3Ctext x=%2750%27 y=%2766%27 text-anchor=%27middle%27 font-size=%2746%27 font-family=%27sans-serif%27 fill=%27white%27%3Ep%3C/text%3E%3C/svg%3E">
  <title>Penny · Add transaction</title>
</head>
<body class="bg-bg text-ink min-h-screen">
  <main class="max-w-md mx-auto px-6 pt-6 pb-8 min-h-screen flex flex-col">
    <header class="grid grid-cols-[40px_1fr_40px] items-center">
      <a href="index.html" id="close" class="w-10 h-10 grid place-items-center rounded-full text-muted hover:bg-soft" aria-label="Close"></a>
      <h1 class="text-center font-display font-semibold" id="title">Add expense</h1><span></span>
    </header>

    <div class="seg mt-6 mx-auto w-[220px]" role="group" aria-label="Type">
      <button type="button" data-type="expense" aria-pressed="true">Expense</button>
      <button type="button" data-type="income" aria-pressed="false">Income</button>
    </div>

    <section class="text-center mt-7">
      <p class="num font-light text-[56px] leading-none" aria-live="polite"><span class="text-muted">₹</span><span id="amount">0</span><span class="caret"></span></p>
      <p class="text-xs text-muted mt-3 tracking-widest">INR</p>
      <p id="err" class="text-xs text-spend mt-2 h-4"></p>
    </section>

    <section class="mt-4">
      <p class="text-xs text-muted">Category</p>
      <div id="cats" class="flex flex-wrap gap-2 mt-3"></div>
    </section>

    <section class="hair mt-6 border-y border-line text-sm">
      <label class="flex items-center justify-between py-3.5 gap-4"><span class="text-muted">Note</span>
        <input id="note" maxlength="40" placeholder="What was it for?" class="bg-transparent text-right outline-none flex-1 placeholder:text-muted/60"></label>
      <label class="flex items-center justify-between py-3.5 gap-4"><span class="text-muted">Date</span>
        <input id="date" type="date" class="bg-transparent text-right outline-none dark:[color-scheme:dark]"></label>
      <label class="flex items-center justify-between py-3.5 gap-4"><span class="text-muted">Account</span>
        <select id="account" class="bg-transparent text-right outline-none">
          <option class="bg-card">UPI · HDFC</option><option class="bg-card">Card · ICICI</option><option class="bg-card">Bank · HDFC</option><option class="bg-card">Cash</option>
        </select></label>
    </section>

    <section id="keypad" class="grid grid-cols-3 gap-1 mt-4" aria-label="Keypad"></section>

    <button id="save" class="mt-auto w-full h-14 flex-none rounded-xl bg-accent text-on-accent font-medium">Save expense</button>
  </main>
  <script src="data/seed.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/add.js"></script>
</body>
</html>

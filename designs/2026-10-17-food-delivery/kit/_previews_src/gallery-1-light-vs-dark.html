<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'DM Sans',sans-serif;overflow:hidden;position:relative;color:#2B1D14;background:radial-gradient(120% 90% at 85% 10%,#FDE3D2 0%,#FBF4EC 55%,#F6EADC 100%)}

.z{position:relative;z-index:2}</style></head><body style="width:1280px;height:720px"><div class="ghost" style="top:300px;font-size:340px">Ember</div><div class="z" style="position:absolute;left:64px;top:46px"><h2 style="font-size:46px">Light and <em>espresso dark</em></h2><p class="s" style="font:400 19px 'DM Sans';margin-top:6px">Cream + terracotta by day, warm brown by night. One toggle, saved in localStorage.</p></div><div class="ph" style="left:290px;top:180px;width:300px;transform:rotate(0deg);z-index:3"><img src="shots/mobile-light-home.png"></div><div class="ph dk" style="left:690px;top:180px;width:300px;transform:rotate(0deg);z-index:3"><img src="shots/mobile-dark-home.png"></div></body></html>

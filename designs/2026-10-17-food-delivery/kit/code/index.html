<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2728%27 fill=%27%23E8622C%27/%3E%3Cpath d=%27M50 80c16 0 26-10 26-25 0-14-10-22-14-34-9 7-11 16-11 22-4-4-6-8-7-13-10 8-20 16-20 25 0 15 10 25 26 25Z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Ember · Fresh &amp; warm, at your door</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-5 pb-40">
    <!-- Header: avatar + delivery address · theme toggle + bell -->
    <header class="flex items-center justify-between">
      <button type="button" id="address" class="flex items-center gap-3 text-left">
        <img src="img/avatar.jpg" alt="Maya" class="w-11 h-11 rounded-full object-cover ring-2 ring-card shadow-soft">
        <span><span class="block text-xs text-muted">Deliver to</span>
          <span class="flex items-center gap-1 font-bold">24 Park Lane <svg class="icon text-accent text-[16px]"><use href="#i-chevdown"/></svg></span></span>
      </button>
      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle class="surface w-10 h-10 rounded-full grid place-items-center shadow-soft"></button>
        <button type="button" id="bell" class="surface relative w-10 h-10 rounded-full grid place-items-center shadow-soft" aria-label="Notifications">
          <svg class="icon text-[19px]"><use href="#i-bell"/></svg><span class="absolute top-2 right-2.5 w-2 h-2 rounded-full bg-accent"></span></button>
      </div>
    </header>

    <!-- Hero: serif headline + overhead bowl -->
    <section class="relative mt-5 flex items-center min-h-[176px]">
      <div class="relative z-10 w-[64%]">
        <h1 class="font-serif text-[35px] md:text-6xl leading-[1.02] font-medium">Fresh &amp; warm,<br><em class="accent">at your door</em></h1>
        <p class="mt-3 text-[13px] text-muted leading-snug pr-2">Chef-made meals from kitchens near you, delivered hot.</p>
      </div>
      <a href="dish.html?id=buddha-bowl" class="absolute -right-14 md:right-0 top-1/2 -translate-y-1/2 w-[180px] h-[180px] md:w-64 md:h-64 rounded-full shadow-bowl" aria-label="Rainbow Buddha Bowl">
        <img src="img/buddha-bowl-cut.png" alt="Rainbow Buddha Bowl, overhead" class="w-full h-full rounded-full object-cover"></a>
    </section>

    <!-- Search -->
    <form id="search-form" role="search" class="mt-6 surface flex items-center gap-3 rounded-full pl-5 pr-1.5 py-1.5 shadow-soft focus-within:ring-2 focus-within:ring-accent/40">
      <svg class="icon text-muted text-[19px]"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search dishes or restaurants" aria-label="Search dishes or restaurants" class="flex-1 min-w-0 bg-transparent outline-none text-[15px] placeholder:text-muted py-2">
      <button type="button" id="filter" class="grad w-10 h-10 rounded-full grid place-items-center shadow-glow" aria-label="Sort by delivery time"><svg class="icon text-[18px]"><use href="#i-sliders"/></svg></button>
    </form>

    <!-- Categories (round icon chips) -->
    <div id="cats" class="mt-6 flex justify-between md:justify-start md:gap-8" role="toolbar" aria-label="Categories"></div>

    <!-- Promo card -->
    <section id="promo" class="promo relative mt-6 rounded-[22px] p-5 overflow-hidden shadow-glow">
      <div class="relative z-10 w-[64%]">
        <p class="text-[11px] font-bold tracking-[.14em] uppercase text-white/85">Weekend deal</p>
        <h2 class="font-serif text-[25px] leading-[1.1] mt-1.5">30% off your<br>first order</h2>
        <button type="button" id="copy-code" class="mt-4 inline-flex items-center gap-2 bg-white text-[#2B1D14] rounded-full pl-4 pr-3 py-2 text-[13px] font-bold tracking-wider shadow-soft">EMBER30 <svg class="icon text-[#E8622C] text-[15px]"><use href="#i-copy"/></svg></button>
      </div>
      <img src="img/burger.jpg" alt="Classic smash burger" class="absolute -right-8 top-1/2 -translate-y-1/2 w-40 h-40 rounded-full object-cover ring-4 ring-white/25">
    </section>

    <!-- Popular near you -->
    <section class="mt-7" aria-labelledby="pop-h">
      <div class="flex items-end justify-between mb-3.5">
        <h2 id="pop-h" class="font-serif text-[24px] font-medium">Popular <em class="accent">near you</em></h2>
        <button type="button" id="see-all" class="text-[13px] font-semibold text-accent">See all</button>
      </div>
      <div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-3.5"></div>
      <p id="empty" hidden class="text-sm text-muted text-center py-10">Nothing matches that. Try "pizza" or "bowl".</p>
    </section>

    <!-- Dish results (search) -->
    <section id="dish-wrap" class="mt-7" hidden aria-labelledby="dish-h">
      <h2 id="dish-h" class="font-serif text-[22px] font-medium mb-3">Dishes</h2>
      <ul id="dishes" class="grid gap-3 md:grid-cols-2"></ul>
    </section>
  </main>

  <!-- Floating cart bar -->
  <a id="cartbar" href="cart.html" class="cartbar grad rounded-full px-5 py-3.5 flex items-center justify-between shadow-glow">
    <span class="flex items-center gap-2 font-semibold"><svg class="icon text-[19px]"><use href="#i-bag"/></svg><span id="cartbar-count">0 items</span></span>
    <span class="font-bold">View cart · <span id="cartbar-total">$0.00</span></span>
  </a>
  <nav id="tabbar" data-active="home"></nav>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2728%27 fill=%27%23E8622C%27/%3E%3Cpath d=%27M50 80c16 0 26-10 26-25 0-14-10-22-14-34-9 7-11 16-11 22-4-4-6-8-7-13-10 8-20 16-20 25 0 15 10 25 26 25Z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Ember · My Cart</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-5 pb-36">
    <header class="flex items-center justify-between">
      <a href="index.html" class="surface w-10 h-10 rounded-full grid place-items-center shadow-soft" aria-label="Back"><svg class="icon text-[20px]"><use href="#i-chevleft"/></svg></a>
      <h1 class="font-serif text-[24px] font-medium">My <em class="accent">cart</em></h1>
      <button type="button" id="clear" class="text-[13px] font-semibold text-muted hover:text-accent">Clear</button>
    </header>

    <div id="full" class="md:grid md:grid-cols-[1fr_320px] md:gap-6">
      <div>
        <!-- Delivery card -->
        <section class="surface rounded-card p-4 mt-5 shadow-soft">
          <div class="flex items-center gap-3">
            <span class="w-11 h-11 rounded-full bg-soft text-accent grid place-items-center flex-none"><svg class="icon text-[20px]"><use href="#i-pin"/></svg></span>
            <div class="flex-1 min-w-0"><p class="text-xs text-muted">Deliver to</p><p id="addr" class="font-semibold truncate">Home · 24 Park Lane, Apt 5</p></div>
            <button type="button" id="change" class="text-[13px] font-semibold text-accent">Change</button>
          </div>
          <p class="mt-3 inline-flex items-center gap-1.5 rounded-full bg-soft/70 px-3 py-1.5 text-xs font-semibold"><svg class="icon text-accent text-[14px]"><use href="#i-clock"/></svg>Arrives in 25-30 min</p>
        </section>

        <!-- Items -->
        <h2 id="items-h" class="mt-6 font-serif text-[21px] font-medium">Items</h2>
        <ul id="items" class="mt-3 grid gap-2.5"></ul>
      </div>

      <div>
        <!-- Promo -->
        <form id="promo-form" class="mt-6 md:mt-5 flex items-center gap-2 rounded-full border-2 border-dashed border-accent/40 pl-4 pr-1.5 py-1.5">
          <svg class="icon text-accent text-[18px]"><use href="#i-tag"/></svg>
          <input id="promo" type="text" placeholder="Promo code" aria-label="Promo code" class="flex-1 min-w-0 bg-transparent outline-none text-sm font-semibold uppercase tracking-wider placeholder:normal-case placeholder:tracking-normal placeholder:font-normal placeholder:text-muted py-1.5">
          <button id="promo-btn" type="submit" class="grad rounded-full px-4 py-2 text-[13px] font-bold">Apply</button>
        </form>
        <p id="promo-msg" class="mt-2 text-xs text-muted px-2">Try EMBER30 for 30% off (up to $10).</p>

        <!-- Bill -->
        <section class="surface rounded-card p-4 mt-4 shadow-soft text-[14px]">
          <div class="flex justify-between py-1"><span class="text-muted">Subtotal</span><span id="sub" class="font-semibold"></span></div>
          <div class="flex justify-between py-1"><span class="text-muted">Delivery fee</span><span id="fee" class="font-semibold"></span></div>
          <div id="disc-row" class="flex justify-between py-1"><span class="text-muted">Promo <span id="disc-code"></span></span><span id="disc" class="font-semibold text-accent"></span></div>
          <div class="border-t border-dashed border-line my-2.5"></div>
          <div class="flex justify-between items-baseline"><span class="font-semibold">Total</span><span id="total" class="font-serif text-[26px] font-semibold"></span></div>
        </section>

        <!-- Payment -->
        <fieldset class="mt-4">
          <legend class="text-sm font-semibold mb-2">Pay with</legend>
          <div id="pay" class="grid grid-cols-3 gap-2"></div>
        </fieldset>
      </div>
    </div>

    <!-- Empty state -->
    <section id="empty" hidden class="text-center py-16">
      <div class="mx-auto w-40 h-40 rounded-full overflow-hidden shadow-bowl"><img src="img/tofu-bowl-cut.png" alt="" class="w-full h-full object-cover opacity-90"></div>
      <h2 class="mt-6 font-serif text-[26px]">Your cart is <em class="accent">empty</em></h2>
      <p class="mt-2 text-sm text-muted">Find something warm and tasty near you.</p>
      <a href="index.html" class="grad inline-block mt-5 rounded-full px-6 py-3 font-bold shadow-glow">Browse restaurants</a>
    </section>
  </main>
  <div id="place-bar" class="fixed bottom-0 inset-x-0 z-40 bg-card/95 backdrop-blur border-t border-line">
    <div class="max-w-md md:max-w-3xl mx-auto px-5 py-3.5" style="padding-bottom:calc(14px + env(safe-area-inset-bottom))">
      <button type="button" id="place" class="grad w-full rounded-full py-4 font-bold shadow-glow">Place order · <span id="place-total"></span></button>
    </div>
  </div>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/cart.js"></script>
</body>
</html>

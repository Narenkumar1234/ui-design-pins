<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2728%27 fill=%27%23E8622C%27/%3E%3Cpath d=%27M50 80c16 0 26-10 26-25 0-14-10-22-14-34-9 7-11 16-11 22-4-4-6-8-7-13-10 8-20 16-20 25 0 15 10 25 26 25Z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Ember · Track order</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-5 pb-32">
    <header class="flex items-center justify-between">
      <a href="index.html" class="surface w-10 h-10 rounded-full grid place-items-center shadow-soft" aria-label="Back to home"><svg class="icon text-[20px]"><use href="#i-chevleft"/></svg></a>
      <h1 class="font-serif text-[24px] font-medium">Track <em class="accent">order</em></h1>
      <button type="button" data-theme-toggle class="surface w-10 h-10 rounded-full grid place-items-center shadow-soft"></button>
    </header>

    <div class="md:grid md:grid-cols-2 md:gap-6">
      <!-- Live map (pure SVG, no API key needed) -->
      <section class="map relative mt-5 rounded-sheet overflow-hidden h-[300px] md:h-[440px] shadow-card">
        <svg id="map" viewBox="0 0 360 300" preserveAspectRatio="xMidYMid slice" class="absolute inset-0 w-full h-full" aria-label="Courier route map" role="img">
          <rect class="park" x="228" y="18" width="110" height="78" rx="18"/>
          <g class="block"><rect x="20" y="20" width="90" height="62" rx="10"/><rect x="130" y="20" width="78" height="62" rx="10"/><rect x="20" y="106" width="60" height="76" rx="10"/><rect x="100" y="106" width="108" height="76" rx="10"/><rect x="228" y="118" width="110" height="64" rx="10"/><rect x="20" y="206" width="120" height="74" rx="10"/><rect x="160" y="206" width="72" height="74" rx="10"/><rect x="252" y="206" width="86" height="74" rx="10"/></g>
          <g class="road" stroke-width="12" fill="none" stroke-linecap="round"><path d="M0 94H360M0 194H360M118 0V300M218 0V300M90 94V194M246 194V300"/></g>
          <path id="route" d="M60 194H118V94H218V150H300" fill="none" stroke-width="0"/>
          <path id="route-todo" class="route-todo" d="M60 194H118V94H218V150H300" fill="none" stroke-width="4" stroke-linecap="round"/>
          <path id="route-done" class="route-done" d="M60 194H118V94H218V150H300" fill="none" stroke-width="5" stroke-linecap="round"/>
          <g transform="translate(60 194)"><circle r="16" fill="#fff" style="stroke:rgb(var(--line))" stroke-width="2"/><use href="#i-chef" x="-9" y="-9" width="18" height="18" style="color:#E8622C" class="icon"/></g>
          <g transform="translate(300 150)"><circle r="22" class="pulse" style="fill:rgba(232,98,44,.35)"/><circle r="14" fill="#E8622C"/><use href="#i-home" x="-8" y="-8" width="16" height="16" style="color:#fff" class="icon"/></g>
          <g id="courier"><circle r="17" style="fill:rgb(var(--ink))"/><use href="#i-scooter" x="-10" y="-10" width="20" height="20" style="color:rgb(var(--bg))" class="icon"/></g>
        </svg>
        <div class="absolute left-3 top-3 surface rounded-full px-3 py-1.5 text-xs font-semibold shadow-soft">Order <span id="oid">#EM00000</span></div>
      </section>

      <div>
        <!-- ETA -->
        <section class="mt-5 flex items-end justify-between">
          <div><p class="text-xs text-muted">Estimated arrival</p><p class="font-serif text-[34px] leading-none mt-1"><span id="eta">25</span> <em class="accent text-[22px]">min</em></p></div>
          <p id="status" class="pill text-accent">Order confirmed</p>
        </section>
        <div class="mt-3 h-2 rounded-full bg-soft overflow-hidden"><div id="bar" class="h-full grad rounded-full transition-all duration-700" style="width:5%"></div></div>

        <!-- Steps -->
        <ol id="steps" class="mt-5 grid gap-3.5"></ol>

        <!-- Courier -->
        <section class="surface rounded-card p-3.5 mt-5 flex items-center gap-3 shadow-soft">
          <span class="w-12 h-12 rounded-full bg-soft text-accent grid place-items-center font-serif text-xl">R</span>
          <div class="flex-1"><p class="font-semibold">Ravi K.</p><p class="text-xs text-muted flex items-center gap-1"><svg class="icon fill text-gold text-[12px]"><use href="#i-star"/></svg> 4.9 · Your courier</p></div>
          <button type="button" id="chat" class="w-10 h-10 rounded-full bg-soft text-accent grid place-items-center" aria-label="Message courier"><svg class="icon text-[18px]"><use href="#i-chat"/></svg></button>
          <button type="button" id="call" class="grad w-10 h-10 rounded-full grid place-items-center shadow-glow" aria-label="Call courier"><svg class="icon text-[18px]"><use href="#i-phone"/></svg></button>
        </section>

        <!-- Summary -->
        <details class="surface rounded-card p-4 mt-4 shadow-soft">
          <summary class="cursor-pointer font-semibold flex justify-between"><span>Order summary</span><span id="sum-total"></span></summary>
          <ul id="sum" class="mt-3 grid gap-1.5 text-sm text-muted"></ul>
        </details>
        <p id="demo-note" hidden class="mt-3 text-xs text-muted text-center">Demo order · place one from the cart to track it live.</p>
      </div>
    </div>
  </main>
  <nav id="tabbar" data-active="orders"></nav>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/track.js"></script>
</body>
</html>

.floatcard{position:absolute;z-index:35;right:24px;top:575px;width:156px;background:#fff;border:1px solid #E5E7EB;border-radius:12px;padding:12px;box-shadow:0 16px 40px -12px rgba(79,70,229,.25);transform:rotate(-4deg);font-family:Inter,sans-serif}

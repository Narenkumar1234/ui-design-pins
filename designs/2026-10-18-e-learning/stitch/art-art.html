<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumo - Sticker Set Illustration Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito Sans', sans-serif;
      background-color: #FFFFFF;
      color: #1E293B;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .font-chunky {
      font-family: 'Fredoka', 'Nunito Sans', sans-serif;
    }
    .clay-tile {
      background-color: #EEF4FF;
      border-radius: 24px;
      box-shadow: 0 10px 25px -4px rgba(111, 163, 240, 0.12), 0 4px 10px -2px rgba(111, 163, 240, 0.06);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .clay-tile:hover {
      transform: translateY(-4px) scale(1.015);
      box-shadow: 0 18px 32px -4px rgba(111, 163, 240, 0.2), 0 8px 16px -2px rgba(111, 163, 240, 0.1);
    }
    .badge-pill {
      background-color: #E6F0FF;
      color: #3B82F6;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#FFFFFF] min-h-screen py-12 px-4 sm:px-6 md:px-8 flex flex-col items-center">
  <main class="w-full max-w-xl mx-auto flex flex-col items-center">
    
    <!-- Top Meta Tag / Pill -->
    <div class="mb-4">
      <span class="badge-pill inline-flex items-center gap-1.5 px-3.5 py-1 text-xs font-bold tracking-wide uppercase">

        Asset Library

    <!-- Header Section -->

            loading="eager"

        </div>
        <span class="mt-3 text-sm font-bold text-[#1E293B] tracking-tight group-hover:text-[#3B82F6] transition-colors">

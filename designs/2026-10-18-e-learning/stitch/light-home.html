<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lumo - Learning App</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Nunito:wght@400;600;700;800&amp;family=Public+Sans:wght@600;700;800&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#6FA3F0",
            "primary-light": "#8FB8F5",
            "on-surface": "#1F2A44",
            "on-surface-variant": "#8A94A8",
            outline: "#8A94A8",
            surface: "#FFFFFF",
            "tile-peach": "#FBD9D6",
            "tile-butter": "#FFE9C2",
            "tile-lavender": "#E4DBF2",
            "tile-sky": "#D6E6FF",
            page: "#F4F8FF"
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "card": "1.5rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Fredoka", "Public Sans", "sans-serif"],
            display: ["Fredoka", "Public Sans", "sans-serif"],
            body: ["Nunito", "Nunito Sans", "sans-serif"],
            label: ["Fredoka", "Public Sans", "sans-serif"]
          },
          boxShadow: {
            'clay-card': '0 12px 32px -4px rgba(111, 163, 240, 0.12), 0 4px 12px -2px rgba(31, 42, 68, 0.04)',
            'clay-button': '0 8px 24px -2px rgba(111, 163, 240, 0.45), inset 0 2px 4px rgba(255, 255, 255, 0.35)',
            'clay-tile': '0 8px 20px -4px rgba(111, 163, 240, 0.15), inset 0 -2px 6px rgba(0, 0, 0, 0.03)',
            'clay-nav': '0 12px 36px -4px rgba(111, 163, 240, 0.28), 0 4px 12px rgba(31, 42, 68, 0.04)',
            'clay-avatar': '0 4px 14px rgba(111, 163, 240, 0.22)'
          }
        },
      },
    }
  </script>
<style>
    body {
      background-color: #F4F8FF;
      background-image: radial-gradient(circle at 50% 0%, #FFFFFF 0%, #F4F8FF 65%);
      color: #1F2A44;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 450, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    .font-chunky {
      font-family: 'Fredoka', cursive, sans-serif;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body class="min-h-screen flex justify-center items-center py-0 md:py-6 selection:bg-primary-light selection:text-white">
<!-- Mobile Viewport Container (390 x 844 ratio) -->
<main class="w-full max-w-[390px] min-h-[844px] bg-[#F4F8FF] relative flex flex-col justify-between overflow-x-hidden md:rounded-[40px] md:shadow-2xl md:ring-1 md:ring-blue-100/60 pb-28">
<!-- Top App Bar (docked full-width top-0, background soft blur) -->
<header class="w-full z-40 flex items-center justify-between px-6 pt-5 pb-3 bg-white/80 backdrop-blur-md sticky top-0 shadow-sm shadow-blue-100/50">
<!-- Leading: Student avatar & greeting -->
<div class="flex items-center gap-3">
<div class="relative w-11 h-11 rounded-full p-0.5 bg-gradient-to-tr from-primary to-primary-light shadow-clay-avatar flex items-center justify-center">
<div class="w-full h-full rounded-full bg-[#E8F1FD] flex items-center justify-center overflow-hidden border border-white">
<!-- Gentle pastel student avatar with glasses -->
<svg class="w-8 h-8 text-primary" fill="none" viewbox="0 0 40 40">
<circle cx="20" cy="16" fill="#FFE0B2" r="10"></circle>
<path d="M14 12c1.5-2 5-3 8-2 3 1 4.5 3 4.5 3" stroke="#5D4037" stroke-linecap="round" stroke-width="2"></path>
<circle cx="16" cy="16" fill="none" r="3.2" stroke="#1F2A44" stroke-width="1.8"></circle>
<circle cx="24" cy="16" fill="none" r="3.2" stroke="#1F2A44" stroke-width="1.8"></circle>
<path d="M19.2 16h1.6" stroke="#1F2A44" stroke-linecap="round" stroke-width="1.8"></path>
<circle cx="16" cy="16" fill="#1F2A44" r="1.2"></circle>
<circle cx="24" cy="16" fill="#1F2A44" r="1.2"></circle>
<path d="M18.5 20c.8.6 2.2.6 3 0" stroke="#E57373" stroke-linecap="round" stroke-width="1.5"></path>
<path d="M8 38c0-6.6 5.4-12 12-12s12 5.4 12 12" fill="#6FA3F0"></path>
</svg>
</div>
</div>
<div class="flex flex-col">
<span class="text-xs font-semibold text-outline tracking-normal">Good morning</span>
<span class="text-lg font-chunky font-bold text-on-surface leading-tight">Aarav</span>
</div>
</div>
<!-- Trailing: Notification Button -->
<button aria-label="Notifications" class="w-11 h-11 rounded-full bg-white shadow-clay-card flex items-center justify-center text-on-surface hover:opacity-80 active:scale-95 transition-all duration-150 relative" type="button">
<span class="material-symbols-outlined text-[22px] text-on-surface">notifications</span>
<span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-primary rounded-full border-2 border-white"></span>
</button>
</header>
<!-- Scrollable Content Canvas -->
<div class="px-6 flex-1 flex flex-col gap-5 pt-3">
<!-- Hero Section with Clay Mascot -->
<section class="flex flex-col items-center text-center">
<!-- 3D Clay Lightbulb Mascot -->
<div class="relative w-44 h-44 flex items-center justify-center mb-1">
<!-- Ambient soft aura backdrop -->
<div class="absolute w-36 h-36 bg-[#D6E6FF]/70 rounded-full blur-xl transform translate-y-2"></div>
<div class="absolute w-32 h-32 rounded-full bg-gradient-to-b from-[#E7F0FE] to-[#D9E7FC]/80 shadow-inner"></div>
<!-- Image Asset: 3D Clay Mascot -->
<img alt="Cute 3D clay lightbulb mascot holding an open blue book" class="relative z-10 w-40 h-40 object-contain drop-shadow-[0_12px_16px_rgba(111,163,240,0.22)] select-none pointer-events-none transition-transform hover:scale-105 duration-300" src="https://lh3.googleusercontent.com/aida/AEtjO1V5Ny-_Jv-5le_zKa_WAsmdPXPrWB0mA4nY8vfMlo8oct1Pc0Qxl8f-jTZSI5niWeSDw9iqaG8GkpubvgQaJPr2l2DMIB3JKFxb35EtNL7ghp4L7Y6Gc0NoF_H9hiX-5kFcM3EpiVK7kvAc6tKMZkexcImbQ4O6SgiLq_zm9dbNjofXGJJ79rURgZaS-0IhymQiCgTKGnLvpX5QfVLQQFGde4syTNwBHX8KrscA0dooxX3FBU1_6vl8yYE"/>
</div>
<!-- Chunky Headings -->
<h1 class="font-chunky text-[32px] leading-[1.15] font-bold text-on-surface tracking-tight mb-1.5">
          Learn something <br/>
<span class="text-primary bg-clip-text text-transparent bg-gradient-to-r from-primary to-primary-light">new today</span>
</h1>
<p class="text-sm font-semibold text-outline mb-4">
          12 min a day keeps your streak alive
        </p>
<!-- CTA Pill Button -->
<button class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-primary-light to-primary text-white font-chunky font-bold text-base shadow-clay-button flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.98] transition-transform duration-150">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
<span>Continue: UI Design Basics</span>
</button>
</section>
<!-- Progress Section Card -->
<section class="bg-white rounded-card p-4 shadow-clay-card flex flex-col gap-2.5">
<div class="flex items-center justify-between">
<div class="flex items-center gap-2.5">
<div class="w-8 h-8 rounded-full bg-tile-sky flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">menu_book</span>
</div>
<span class="font-chunky font-bold text-base text-on-surface">Your progress</span>
</div>
<span class="text-xs font-bold text-outline">Lesson 4 of 12</span>
</div>
<!-- Sleek Rounded Progress Bar -->
<div class="w-full bg-[#EDF3FD] h-3 rounded-full overflow-hidden p-0.5">
<div class="bg-gradient-to-r from-primary-light to-primary h-full rounded-full transition-all duration-500 shadow-sm" style="width: 35%"></div>
</div>
<div class="flex items-center justify-between pt-0.5 text-xs font-semibold text-outline">
<span class="flex items-center gap-1 text-on-surface font-bold">
<span class="material-symbols-outlined text-sm text-amber-500" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span>Daily Goal</span>
</span>
<span class="text-primary font-bold">35% completed</span>
</div>
</section>
<!-- Today's picks Section -->
<section class="flex flex-col gap-3">
<div class="flex items-center justify-between px-1">
<h2 class="font-chunky font-bold text-xl text-on-surface">Today's picks</h2>
<button class="text-sm font-bold text-primary hover:opacity-80 active:scale-95 transition-all">See all</button>
</div>
<!-- 3 Pastel Square Tiles -->
<div class="grid grid-cols-3 gap-3">
<!-- Peach Tile: Coding -->
<div class="flex flex-col items-center bg-tile-peach rounded-card p-2.5 pt-3 pb-3 shadow-clay-tile active:scale-95 hover:opacity-90 transition-transform cursor-pointer">
<div class="w-16 h-16 rounded-2xl bg-white/50 backdrop-blur-xs flex items-center justify-center p-1 mb-2 shadow-sm">
<img alt="Cute 3D clay laptop character with pastel keys" class="w-14 h-14 object-contain pointer-events-none drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1WV9zNrcs-7Xfmk-pSHk1ujh_aslhJ8fG6q5i4Rd5sLeB20X3a98dqLl1AMC8k0i0Y1ZtqP38EHggToz6elu5vtigwLuuby93bATq42PpzkjMhsyrFNcUS61xio-08ddXUU0kmfWnqdTYY8Fg4y2M6Qbrzong0E56e2lm6hiX7aI4p5NCsKfo8puxiLW19BchjyPJS3sfcLX0jTzzH7DQv3xJEtz02GRZMHQsu7O-SfO_gGlHsTfVZZchw"/>
</div>
<span class="font-chunky font-bold text-sm text-on-surface">Coding</span>
</div>
<!-- Butter Cream Tile: Design -->
<div class="flex flex-col items-center bg-tile-butter rounded-card p-2.5 pt-3 pb-3 shadow-clay-tile active:scale-95 hover:opacity-90 transition-transform cursor-pointer">
<div class="w-16 h-16 rounded-2xl bg-white/50 backdrop-blur-xs flex items-center justify-center p-1 mb-2 shadow-sm">
<img alt="Cute 3D clay smiling pencil character" class="w-14 h-14 object-contain pointer-events-none drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1UvzH_MQ0i3lQqjAyfseBZQb7iTHjU2KBy1-jSkZFHZDMOHYHHurStujtCbUV68VPPSNelLALYyIVv8HgkAycX2ptF2EMxRN0-VWrbwQVHoAxZXISivLurrsSf-dXTBCBFeIYB6vJZmpfNvtT9JdxiP0Z_dUz62xhDYTncV9DJlAFiNb0ajOWGBP__Wsy7udvRLkpIcfHQ4O0VPbIaVDWVi1BKE30-O1Z1YjHo121BWm45R1fs8fahZXag"/>
</div>
<span class="font-chunky font-bold text-sm text-on-surface">Design</span>
</div>
<!-- Lavender Tile: Science -->
<div class="flex flex-col items-center bg-tile-lavender rounded-card p-2.5 pt-3 pb-3 shadow-clay-tile active:scale-95 hover:opacity-90 transition-transform cursor-pointer">
<div class="w-16 h-16 rounded-2xl bg-white/50 backdrop-blur-xs flex items-center justify-center p-1 mb-2 shadow-sm">
<img alt="Cute 3D clay chemistry beaker with bubbly potion" class="w-14 h-14 object-contain pointer-events-none drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1VtBfApIX2oZcLrzHf0BarJUgTidSFUeQnoFu-qf0gshyMzofUnkS6HxRTOxXbm3rltJ-pyEQnJCuL9Pmm4YJzscObdhgDCpHaX6srUQlxwWbcL1hgA8Dw_zOy5AlSDhvUcJ8AyoLrTfl-SCz30yWJWhlUsw5j0FlFe6T0gu1STRuD8NsFPGQXnrbDGHIoGVGwICfG-dlkqHEZG26WOUHN5lNBa6GEMiCH1d4A9Qf6r-0NPv7JjmpeuhqQ"/>
</div>
<span class="font-chunky font-bold text-sm text-on-surface">Science</span>
</div>
</div>
</section>
</div>
<!-- Floating Bottom Navigation Bar (BottomNavBar) -->
<nav class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto z-50 px-4 mb-5">
<div class="bg-white rounded-full mx-auto shadow-clay-nav px-3 py-2 flex justify-between items-center">
<!-- Tab 1: Home (ACTIVE - Intent match) -->
<button class="flex flex-col items-center justify-center bg-primary text-white rounded-full px-4 py-2 shadow-md shadow-primary/30 transition-all duration-300 active:scale-90">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[11px] font-chunky font-bold tracking-tight mt-0.5">Home</span>
</button>
<!-- Tab 2: Explore -->
<button class="flex flex-col items-center justify-center text-outline hover:text-on-surface px-3 py-1.5 transition-colors duration-200 active:scale-90">
<span class="material-symbols-outlined text-[20px]">explore</span>
<span class="text-[11px] font-chunky font-bold tracking-tight mt-0.5">Explore</span>
</button>
<!-- Tab 3: My courses -->
<button class="flex flex-col items-center justify-center text-outline hover:text-on-surface px-3 py-1.5 transition-colors duration-200 active:scale-90">
<span class="material-symbols-outlined text-[20px]">menu_book</span>
<span class="text-[11px] font-chunky font-bold tracking-tight mt-0.5">My courses</span>
</button>
<!-- Tab 4: Profile -->
<button class="flex flex-col items-center justify-center text-outline hover:text-on-surface px-3 py-1.5 transition-colors duration-200 active:scale-90">
<span class="material-symbols-outlined text-[20px]">person</span>
<span class="text-[11px] font-chunky font-bold tracking-tight mt-0.5">Profile</span>
</button>
</div>
</nav>
</main>
</body></html>

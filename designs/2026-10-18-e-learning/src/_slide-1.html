/* ---- Lumo e-learning variant: pastel 3D clay on a pale sky gradient (ref: @uiux.build "MILO") ---- */
body{font-family:Nunito,system-ui,sans-serif;color:#1F2A44;
 background:linear-gradient(180deg,#CFE3FF 0%,#DCEBFF 45%,#E8F1FF 100%)}
.glow{position:absolute;left:50%;top:58%;width:1100px;height:900px;transform:translate(-50%,-50%);border-radius:50%;z-index:0;
 background:radial-gradient(ellipse at center,rgba(255,255,255,.85) 0,rgba(255,255,255,.35) 38%,rgba(255,255,255,0) 68%)}
header b,footer b{font-family:Fredoka,Nunito,sans-serif;font-weight:600;color:#1F2A44;letter-spacing:0}
header span,footer span{color:#5F6F8E} footer span{font-weight:700}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;letter-spacing:-1.5px;color:#1F2A44;z-index:20;line-height:1.02}
h1 b,h1 em{font-style:normal;font-weight:600;color:#4F86E3;letter-spacing:-1.5px}
h1.m{font-size:78px;letter-spacing:-1.2px} h1.pin{font-size:80px}
.sub{color:#5F6F8E;z-index:20;font-weight:600;font-size:29px}
/* straight phones */
.phone{position:absolute;aspect-ratio:9/19.3;border-radius:50px;background:#FFFFFF;padding:9px;transform:none;
 box-shadow:0 0 0 2px #D5E3F8,0 2px 0 3px #fff inset,0 50px 70px -28px rgba(46,84,150,.42),0 16px 30px rgba(46,84,150,.12)}
.phone.dk{background:#0C1220;box-shadow:0 0 0 2px #2A3A5C,0 50px 70px -28px rgba(8,14,30,.6),0 16px 30px rgba(8,14,30,.25)}
.scr{border-radius:41px;background:#F4F8FF} .dk .scr{background:#121A2B}
.sb{color:#1F2A44;font-family:Nunito;font-weight:800;font-size:12.5px;padding:0 26px} .dk .sb{color:#EEF3FF}
.sb .ic{display:flex;align-items:flex-end;gap:2px;height:10px}
.sb .ic i{display:block;width:3px;background:currentColor;border-radius:1px}
.sb .ic i:nth-child(1){height:4px}.sb .ic i:nth-child(2){height:6px}.sb .ic i:nth-child(3){height:9px}
.sb .ic b{display:block;width:18px;height:9px;border:1.5px solid currentColor;border-radius:3px;margin-left:5px;position:relative}
.sb .ic b:after{content:'';position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:65%;background:currentColor;border-radius:1px}
.notch{width:31%;height:22px;top:8px}
.home{background:rgba(31,42,68,.55)} .dk .home{background:rgba(238,243,255,.7)}
/* clay art + soft blobs */
img.clay{position:absolute;z-index:25;filter:drop-shadow(0 26px 22px rgba(46,84,150,.28))}
img.clay.back{z-index:5}
.cblob{position:absolute;border-radius:50%;z-index:2;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(255,255,255,.5) 40%,rgba(255,255,255,0) 70%)}
/* chips */
.gchip{position:absolute;z-index:30;background:#fff;border-radius:24px;padding:14px 20px;white-space:nowrap;box-shadow:0 22px 44px -18px rgba(46,84,150,.45);font-size:19px;font-weight:800;color:#1F2A44}
.gchip small{display:block;font-size:14px;font-weight:700;color:#8A94A8;margin-top:2px}
.gchip .bar{display:block;height:8px;border-radius:9px;background:#EAF2FF;margin-top:9px;overflow:hidden}
.gchip .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#8FB8F5,#6FA3F0)}
.gchip.btn{background:linear-gradient(135deg,#8FB8F5,#6FA3F0);color:#fff;border-radius:999px;padding:16px 28px;font-family:Fredoka;font-weight:600;font-size:22px;text-shadow:0 1px 2px rgba(40,80,160,.25);box-shadow:0 20px 36px -14px rgba(79,134,227,.8)}
.gchip.btn small{color:rgba(255,255,255,.9)}
.gchip.tile{display:flex;align-items:center;gap:12px}
.gchip .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
/* callouts: navy pill + line + periwinkle dot */
.colines{position:absolute;left:0;top:0;z-index:38;pointer-events:none;overflow:visible}
.colines line{stroke:#1F2A44;stroke-width:2.2;stroke-linecap:round}
.co2{position:absolute;z-index:40;height:42px;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:#1F2A44;color:#fff;font-size:18.5px;font-weight:800;border-radius:999px;box-shadow:0 12px 24px -10px rgba(31,42,68,.5)}
.co2.o{background:linear-gradient(135deg,#8FB8F5,#5F96EC);color:#fff;text-shadow:0 1px 2px rgba(40,80,160,.3)}
.co2.w{background:#fff;color:#1F2A44}
.dot{position:absolute;z-index:41;width:18px;height:18px;border-radius:50%;background:#fff;border:4.5px solid #6FA3F0;box-shadow:0 2px 8px rgba(31,42,68,.3)}
/* dark slide: deep navy */
body.night{background:linear-gradient(180deg,#121A2B 0%,#16203A 55%,#1C2740 100%)}

.night header b,.night footer b,.night h1{color:#EEF3FF} .night header span,.night footer span,.night .sub{color:#8E9BB8}
.night h1 b,.night h1 em{color:#9CC2F7}

.night .co2.o{background:linear-gradient(135deg,#9CC2F7,#7FAEF3);color:#0E1626;text-shadow:none}
.night .dot{border-color:#7FAEF3}
/* CTA */
.st{background:#fff;border:0;color:#1F2A44;border-radius:22px;font-family:Fredoka;font-weight:600;box-shadow:0 14px 30px -18px rgba(46,84,150,.45);min-width:148px}
.st span{color:#4F86E3;font-family:Nunito;font-weight:800} .ar{color:#8FB8F5}
.ben li{color:#1F2A44;font-weight:700} .ben li b{background:linear-gradient(135deg,#8FB8F5,#6FA3F0)}
.kw{font-family:Fredoka;font-weight:600;background:linear-gradient(135deg,#8FB8F5,#5F96EC);color:#fff;padding:0 24px;border-radius:24px;letter-spacing:1px;font-size:.9em;display:inline-block;line-height:1.14;vertical-align:.06em;box-shadow:0 18px 34px -14px rgba(79,134,227,.8);text-shadow:0 2px 3px rgba(40,80,160,.25)}

.pal{position:absolute;z-index:20;display:flex;gap:12px}
.sw{width:96px}

.sw small{display:block;font-size:13px;color:#5F6F8E;font-family:ui-monospace,Menlo,monospace}

.card p,.card li{font-size:17px;line-height:1.45;color:#5F6F8E;font-weight:600} .card .ink{color:#1F2A44}
.tagl{font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#4F86E3}
.chipz{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

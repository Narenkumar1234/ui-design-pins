<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumo - Home</title>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            background: "#121A2B",
            surface: "#1C2740",
            "surface-raised": "#24314F",
            "on-surface": "#EEF3FF",
            "on-surface-variant": "#8E9BB8",
            primary: "#7FAEF3",
            "on-primary": "#121A2B",
            "tile-peach": "#3A2B35",
            "tile-cream": "#3A3428",
            "tile-lavender": "#2E2A45",
            "tile-sky": "#22365A",
          },
          borderRadius: {
            DEFAULT: "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "2xl": "1.5rem", /* 24px */
            "full": "9999px"

          fontFamily: {
            headline: ["Fredoka", "Public Sans", "sans-serif"],
            display: ["Fredoka", "Public Sans", "sans-serif"],
            body: ["Nunito Sans", "sans-serif"],
            label: ["Public Sans", "Nunito Sans", "sans-serif"]

<style>
    .material-symbols-outlined {

      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .clay-mascot-glow {
      background: radial-gradient(circle, rgba(127, 174, 243, 0.22) 0%, rgba(34, 54, 90, 0.5) 55%, transparent 75%);
    }
    /* Hide scrollbars for horizontal pill scroll */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

<body class="bg-background text-on-surface font-body min-h-screen flex flex-col justify-between selection:bg-primary/20 selection:text-primary">
<!-- Mobile Viewport Shell (Max-w-md centered for preview) -->
<div class="w-full max-w-md mx-auto min-h-screen flex flex-col bg-background relative pb-28 pt-4 px-4 overflow-x-hidden">

<div class="flex items-center space-x-3">

<span class="absolute bottom-0 right-0 w-3 h-3 bg-primary border-2 border-background rounded-full"></span>
</div>
<div class="flex flex-col">
<span class="text-on-surface-variant font-label text-xs tracking-wide">Good morning</span>
<span class="text-on-surface font-headline font-bold text-base tracking-normal">Aarav</span>
</div>
</div>
<!-- Right: Raised Notification Bell Button -->
<button class="w-11 h-11 rounded-full bg-surface-raised flex items-center justify-center text-on-surface-variant hover:text-on-surface shadow-clay-raised active:scale-95 transition-all duration-150">

<div class="absolute top-2 w-64 h-64 clay-mascot-glow rounded-full blur-xl pointer-events-none -z-0"></div>
<!-- 3D Clay Mascot: Lightbulb with Book -->
<div class="relative z-10 w-48 h-48 sm:w-52 sm:h-52 mb-1 flex items-center justify-center transform transition-transform duration-300 hover:scale-105">

<span class="text-on-surface block">Learn something</span>
<span class="text-primary block">new today</span>
</h1>
<p class="text-on-surface-variant text-sm font-body pt-1 font-medium">

          </p>
</div>
<!-- CTA Pill Button -->
<div class="relative z-10 w-full px-2 pt-4">
<button class="w-full py-4 px-6 rounded-full bg-primary text-on-primary font-headline font-bold text-base flex items-center justify-center space-x-2.5 shadow-glow-periwinkle hover:brightness-105 active:scale-98 transition-all duration-200">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">play_circle</span>
<span class="tracking-wide">Continue: UI Design Basics</span>
</button>
</div>
</section>
<!-- YOUR PROGRESS CARD -->
<section class="px-1">
<div class="bg-surface rounded-2xl p-4 sm:p-5 shadow-clay flex flex-col space-y-3.5 transition-transform duration-200 hover:-translate-y-0.5">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2.5">
<div class="w-8 h-8 rounded-full bg-surface-raised flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-lg">menu_book</span>
</div>
<h2 class="font-headline font-semibold text-on-surface text-base">Your progress</h2>
</div>
<span class="text-on-surface-variant font-label text-xs font-semibold">Lesson 4 of 12</span>
</div>
<!-- Progress Bar -->
<div class="w-full bg-surface-raised h-2.5 rounded-full overflow-hidden p-0.5 shadow-soft-inner">
<div class="bg-primary h-full rounded-full transition-all duration-700 ease-out shadow-glow-periwinkle" style="width: 35%"></div>
</div>
</div>
</section>
<!-- TODAY'S PICKS SECTION -->
<section class="flex flex-col space-y-3 px-1 pt-1">
<!-- Section Header -->
<div class="flex items-center justify-between px-1">
<h2 class="font-headline font-bold text-on-surface text-xl tracking-tight">Today's picks</h2>
<button class="text-primary font-headline font-semibold text-sm hover:underline hover:opacity-90 transition-opacity">
            See all
          </button>
</div>
<!-- 3 Bento-style Pastel Square Tiles -->
<div class="grid grid-cols-3 gap-3">
<!-- Tile 1: Coding (Peach Tint) -->
<div class="bg-tile-peach rounded-[20px] p-3 flex flex-col items-center justify-between shadow-clay group cursor-pointer hover:bg-tile-peach/90 active:scale-95 transition-all duration-150 aspect-[4/5]">

<!-- Tile 2: Design (Cream Tint) -->

<div class="w-16 h-16 sm:w-18 sm:h-18 flex items-center justify-center my-auto transform group-hover:scale-108 transition-transform duration-200">
<img class="w-full h-full object-contain filter drop-shadow-[0_8px_12px_rgba(0,0,0,0.35)]" src="https://lh3.googleusercontent.com/aida/AEtjO1UvzH_MQ0i3lQqjAyfseBZQb7iTHjU2KBy1-jSkZFHZDMOHYHHurStujtCbUV68VPPSNelLALYyIVv8HgkAycX2ptF2EMxRN0-VWrbwQVHoAxZXISivLurrsSf-dXTBCBFeIYB6vJZmpfNvtT9JdxiP0Z_dUz62xhDYTncV9DJlAFiNb0ajOWGBP__Wsy7udvRLkpIcfHQ4O0VPbIaVDWVi1BKE30-O1Z1YjHo121BWm45R1fs8fahZXag"/>
</div>
<span class="font-headline font-bold text-sm text-[#F6EBD9] tracking-tight mt-1">Design</span>
</div>
<!-- Tile 3: Science (Lavender Tint) -->
<div class="bg-tile-lavender rounded-[20px] p-3 flex flex-col items-center justify-between shadow-clay group cursor-pointer hover:bg-tile-lavender/90 active:scale-95 transition-all duration-150 aspect-[4/5]">
<div class="w-16 h-16 sm:w-18 sm:h-18 flex items-center justify-center my-auto transform group-hover:scale-108 transition-transform duration-200">
<img class="w-full h-full object-contain filter drop-shadow-[0_8px_12px_rgba(0,0,0,0.35)]" src="https://lh3.googleusercontent.com/aida/AEtjO1VtBfApIX2oZcLrzHf0BarJUgTidSFUeQnoFu-qf0gshyMzofUnkS6HxRTOxXbm3rltJ-pyEQnJCuL9Pmm4YJzscObdhgDCpHaX6srUQlxwWbcL1hgA8Dw_zOy5AlSDhvUcJ8AyoLrTfl-SCz30yWJWhlUsw5j0FlFe6T0gu1STRuD8NsFPGQXnrbDGHIoGVGwICfG-dlkqHEZG26WOUHN5lNBa6GEMiCH1d4A9Qf6r-0NPv7JjmpeuhqQ"/>
</div>
<span class="font-headline font-bold text-sm text-[#D7D2FB] tracking-tight mt-1">Science</span>
</div>
</div>
</section>
</main>
<!-- SHARED COMPONENT: BottomNavBar (Fixed Shell) -->
<nav class="fixed bottom-4 left-4 right-4 z-50 flex justify-around items-center px-4 py-3 max-w-md mx-auto rounded-full bg-surface shadow-lg shadow-black/25 backdrop-blur-md">
<!-- Tab 1: Home (ACTIVE - exact semantic match for this screen) -->
<a class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-4 py-1.5 transition-all duration-200 active:scale-95" href="#">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-body text-[11px] font-bold tracking-tight">Home</span>
</a>
<!-- Tab 2: Explore -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-3 py-1.5 active:scale-95" href="#">
<span class="material-symbols-outlined text-xl">explore</span>
<span class="font-body text-[11px] font-semibold tracking-tight">Explore</span>
</a>
<!-- Tab 3: My courses -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-3 py-1.5 active:scale-95" href="#">
<span class="material-symbols-outlined text-xl">menu_book</span>
<span class="font-body text-[11px] font-semibold tracking-tight">My courses</span>
</a>
<!-- Tab 4: Profile -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors px-3 py-1.5 active:scale-95" href="#">
<span class="material-symbols-outlined text-xl">person</span>
<span class="font-body text-[11px] font-semibold tracking-tight">Profile</span>
</a>
</nav>
</div>
</body></html>

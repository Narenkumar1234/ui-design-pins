<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Nunito,sans-serif;overflow:hidden;position:relative;color:#1F2A44;background:linear-gradient(180deg,#CFE3FF 0%,#DCEBFF 50%,#E8F1FF 100%)}
.glow{position:absolute;left:50%;top:60%;width:1300px;height:900px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.85) 0,rgba(255,255,255,.3) 40%,rgba(255,255,255,0) 68%)}
.ph{position:absolute;background:#fff;border-radius:46px;padding:9px;z-index:3;box-shadow:0 0 0 2px #D5E3F8,0 44px 70px -26px rgba(46,84,150,.42)}
.ph.dk{background:#0C1220;box-shadow:0 0 0 2px #2A3A5C,0 44px 70px -26px rgba(8,14,30,.6)}
.ph img{display:block;width:100%;border-radius:37px}
h1,h2{font-family:Fredoka,Nunito,sans-serif;font-weight:600;letter-spacing:-1px;line-height:1.04}
em{font-style:normal;color:#4F86E3}
.pill{display:inline-block;background:#fff;border-radius:999px;padding:9px 18px;font:800 15px Nunito;color:#1F2A44;box-shadow:0 10px 22px -14px rgba(46,84,150,.5)}
.pill.a{background:linear-gradient(135deg,#8FB8F5,#5F96EC);color:#fff}
.tag{font:800 13px Nunito;letter-spacing:4px;text-transform:uppercase;color:#4F86E3}p.s{color:#5F6F8E;font-weight:600}
.clay{position:absolute;z-index:4;filter:drop-shadow(0 24px 22px rgba(46,84,150,.28))}
.z{position:relative;z-index:5}</style></head><body style="width:1280px;height:720px"><div class="glow"></div><div class="z" style="position:absolute;left:64px;top:46px"><h2 style="font-size:46px">Light and <em>navy dark</em></h2><p class="s" style="font-size:19px;margin-top:8px">Sky blue + periwinkle by day, deep navy by night. One toggle, saved in localStorage.</p></div><div class="ph" style="left:300px;top:190px;width:300px;z-index:3"><img src="shots/mobile-light-home.png"></div><div class="ph dk" style="left:680px;top:190px;width:300px;z-index:3"><img src="shots/mobile-dark-home.png"></div><img class="clay" src="../code/img/pencil.png" style="left:1030px;top:250px;width:170px;transform:rotate(10deg)"><img class="clay" src="../code/img/books.png" style="left:80px;top:330px;width:180px;transform:rotate(-6deg)"></body></html>

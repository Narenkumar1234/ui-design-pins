<!doctype html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}
/* ---- Folio reading-app variant: flat light-grey slides with two STRAIGHT phones side by side (left one larger, in front),
   monochrome type + one orange accent (style ref: @uxpected.abhi "Book Reading App UI Concept"; style only, nothing copied) ---- */
body{font-family:Urbanist,system-ui,sans-serif;color:#141414;position:relative;overflow:hidden;background:#E6E6E6}
.floor{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.035))}
header,footer{position:absolute;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;z-index:50}
header{top:52px;font-size:28px} header b{font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:12px}
header b i{width:12px;height:12px;border-radius:50%;background:#E8742A;display:block}
header span{font-weight:600;color:#8A8A8A;font-size:26px}
footer{bottom:46px} footer b{font-size:26px;font-weight:800} footer span{font-size:17px;letter-spacing:3px;color:#8A8A8A;font-weight:700}
h1{position:absolute;left:60px;right:60px;top:140px;font-weight:800;font-size:84px;line-height:1.0;letter-spacing:-3px;z-index:20;color:#141414}
h1 em{font-style:normal;color:#E8742A}
h1 .lt{font-weight:400;letter-spacing:-2.4px}
h1.m{font-size:70px;letter-spacing:-2.4px}
h1.c,.sub.c{text-align:center}
.sub{position:absolute;left:60px;right:60px;font-size:28px;line-height:1.36;color:#5F5F5F;top:250px;z-index:20;font-weight:500}
.cover footer{display:none}
/* phones: black thin-bezel frames (both themes, like the reference), flat soft drop shadow */
.phone{position:absolute;border-radius:52px;padding:10px;z-index:10;background:#141414;
 box-shadow:0 0 0 2px #2A2A2A,inset 0 0 0 1.5px #3A3A3A,0 50px 70px -36px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.10)}
.scr{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:#F5F4F0}
.scr img{position:absolute;left:0;width:100%}
.sb{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;font-weight:700;z-index:2;color:#141414}
.sb.wt{color:#F5F4F0}
.sb .ic{display:flex;align-items:flex-end;gap:2px;height:10px}
.sb .ic i{display:block;width:3px;background:currentColor;border-radius:1px}
.sb .ic i:nth-child(1){height:4px}.sb .ic i:nth-child(2){height:6px}.sb .ic i:nth-child(3){height:9px}
.sb .ic b{display:block;width:18px;height:9px;border:1.5px solid currentColor;border-radius:3px;margin-left:5px;position:relative}
.sb .ic b:after{content:'';position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:65%;background:currentColor;border-radius:1px}
.notch{position:absolute;left:50%;transform:translateX(-50%);width:30%;border-radius:20px;background:#000;z-index:3}
/* chips */
.fchip{position:absolute;z-index:30;background:#fff;color:#141414;border-radius:999px;padding:14px 24px;white-space:nowrap;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 18px 36px -18px rgba(0,0,0,.35)}
.fchip i{width:12px;height:12px;border-radius:50%;background:#E8742A;display:block}
.fchip.k{background:#141414;color:#F5F4F0}
.fchip.o{background:#E8742A;color:#141414} .fchip.o i{background:#141414}
.fchip svg{width:22px;height:22px}
/* callouts: ink pill + ink line + orange-ringed dot */
.colines{position:absolute;left:0;top:0;z-index:38;pointer-events:none;overflow:visible}
.colines line,.colines polyline{stroke:#141414;stroke-width:2.4;stroke-linecap:round;fill:none}
.co2{position:absolute;z-index:40;height:48px;display:flex;align-items:center;justify-content:center;white-space:nowrap;background:#141414;color:#F5F4F0;font-size:20px;font-weight:700;border-radius:999px;box-shadow:0 12px 24px -12px rgba(0,0,0,.45)}
.co2.v{background:#E8742A;color:#141414}
.dot{position:absolute;z-index:41;width:22px;height:22px;border-radius:50%;background:#fff;border:5px solid #E8742A;box-shadow:0 0 0 2px #141414,0 2px 6px rgba(0,0,0,.25)}
/* dark slide */
body.dk{background:#161616;color:#F5F4F0}
.dk .floor{background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.03))}
.dk header b,.dk footer b,.dk h1{color:#F5F4F0} .dk .sub{color:#A3A3A3}
.dk .phone{background:#0A0A0A;box-shadow:0 0 0 2px #333,inset 0 0 0 1.5px #2A2A2A,0 50px 80px -30px rgba(0,0,0,.8)}
.dk .colines line,.dk .colines polyline{stroke:#F5F4F0} .dk .co2{background:#F5F4F0;color:#141414} .dk .co2.v{background:#E8742A;color:#141414}
.dk .dot{box-shadow:0 0 0 2px #F5F4F0,0 2px 6px rgba(0,0,0,.5)}
/* CTA slide: orange */
body.ob{background:#E8742A;color:#141414}
.ob .floor{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.06))}
.ob header span,.ob footer span{color:rgba(20,20,20,.6)} .ob header b i{background:#141414}
.ob .sub{color:rgba(20,20,20,.78)}
.ob h1 em{color:#F5F4F0}
.steps{position:absolute;left:60px;top:450px;display:flex;align-items:center;gap:14px;z-index:20}
.st{background:rgba(20,20,20,.08);color:#141414;border-radius:999px;height:64px;padding:0 26px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;border:2px solid rgba(20,20,20,.85)}
.st.on{background:#141414;color:#F5F4F0}
.st span{font-size:15px;font-weight:800;opacity:.6}
.ar{font-style:normal;color:rgba(20,20,20,.55);font-size:24px;font-weight:700}
.ben{position:absolute;left:60px;top:620px;list-style:none;width:590px;z-index:20}
.ben li{font-size:27px;line-height:1.3;margin-bottom:24px;display:flex;gap:16px;align-items:center;color:#141414;font-weight:600}
.ben li b{flex:none;width:40px;height:40px;border-radius:50%;background:#141414;color:#E8742A;font-size:20px;display:flex;align-items:center;justify-content:center}
.kw{font-weight:900;background:#141414;color:#F5F4F0;padding:0 26px;border-radius:999px;letter-spacing:1px;font-size:.88em;display:inline-block;line-height:1.16;vertical-align:.06em}
.gobtn{position:absolute;z-index:45;width:112px;height:112px;border-radius:50%;background:#141414;display:grid;place-items:center}
.gobtn svg{width:46px;height:46px;fill:none;stroke:#E8742A;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* pin */
.pal{position:absolute;z-index:20;display:flex;gap:12px}
.sw{width:112px}
.sw i{display:block;height:76px;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.sw b{display:block;font-size:16px;font-weight:800;margin-top:8px;color:#141414}
.sw small{display:block;font-size:13px;color:#5F5F5F;font-family:ui-monospace,Menlo,monospace}
.card{position:absolute;z-index:20;background:#fff;border-radius:24px;padding:24px 26px}
.card.k{background:#141414;color:#F5F4F0}
.card h3{font-weight:800;font-size:28px;letter-spacing:-.6px;line-height:1.12}
.card h3 em{color:#E8742A;font-style:normal}
.card p{font-size:17px;line-height:1.45;color:#5F5F5F} .card.k p{color:#B5B5B5} .card .ink{color:#141414;font-weight:700} .card.k .ink{color:#F5F4F0}
.tagl{font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#E8742A}
.chipz{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipz span{font-size:15px;font-weight:700;padding:7px 14px;border-radius:999px;background:#2A2A2A;color:#F5F4F0}
.chipz span:first-child{background:#E8742A;color:#141414}
/* floating CSS book cover (cover slide) */
.bk{position:absolute;z-index:25;border-radius:10px;overflow:hidden;box-shadow:0 30px 50px -24px rgba(0,0,0,.45)}
.pinb footer{display:none}
</style></head><body class="cover" style="width:1080px;height:1350px"><div class="floor"></div>

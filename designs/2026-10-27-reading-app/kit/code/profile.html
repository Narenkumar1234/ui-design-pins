<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect x=%224%22 y=%222%22 width=%2216%22 height=%2220%22 rx=%223%22 fill=%22%23141414%22/%3E%3Ccircle cx=%2212%22 cy=%2211%22 r=%224%22 fill=%22%23E8742A%22/%3E%3C/svg%3E">
  <title>Folio · Profile</title>
</head>
<body data-page="profile" data-nav="user" class="antialiased">
  <main class="max-w-md md:max-w-4xl mx-auto px-5 pt-5 pb-32">
    <header class="flex items-center justify-between">
      <p class="font-extrabold text-[17px] flex items-center gap-1.5">Profile</p>
      <button type="button" data-theme-toggle class="btn-round"></button>
    </header>
    <div class="md:grid md:grid-cols-2 md:gap-8">
      <div>
        <!-- identity -->
        <section class="text-center mt-2">
          <div class="relative w-[92px] h-[92px] mx-auto">
            <div class="w-full h-full rounded-full bg-inv text-oninv grid place-items-center text-[32px] font-extrabold" id="initials">RK</div>
            <span class="absolute -right-0.5 bottom-0.5 w-7 h-7 rounded-full bg-accent text-[#141414] grid place-items-center border-[3px] border-bg" id="badge"></span>
          </div>
          <h1 class="h-title text-[26px] mt-3" id="uname">Riya Kapoor</h1>
          <p class="text-muted text-[14px]" id="handle">@riya.reads</p>
          <div class="flex justify-center gap-2 mt-3"><span class="chip !bg-card border !border-line" id="fwing">Following 128</span><span class="chip !bg-card border !border-line" id="fwers">Followers 96</span></div>
        </section>
        <!-- stats tiles -->
        <section class="grid grid-cols-2 gap-3 mt-6" id="tiles" aria-label="Reading stats"></section>
        <!-- year goal -->
        <section class="card p-4 mt-3"><div class="flex justify-between items-baseline"><p class="font-extrabold">2026 reading goal</p><p class="text-[14px] font-semibold num" id="yg-t">24 / 30</p></div>
          <div class="track mt-3 !h-2"><i id="yg" style="width:80%"></i></div><p class="text-muted text-[13px] mt-2" id="yg-s">6 books to go · on track</p></section>
      </div>
      <div>
        <!-- shelf -->
        <section class="mt-7 md:mt-0"><div class="flex items-baseline justify-between"><h2 class="h-title text-[20px]">My shelf <span class="text-muted text-[15px] font-semibold" id="shelf-n"></span></h2><a href="shelf.html" class="text-[14px] font-semibold text-accent">See all</a></div>
          <div class="hscroll mt-3" id="shelf"></div></section>
        <!-- genres -->
        <section class="mt-7"><h2 class="h-title text-[20px]">Favourite genres</h2><p class="text-muted text-[13px]">Tap to pick what you like. We use it for Up next.</p>
          <div class="flex flex-wrap gap-2 mt-3" id="genres"></div></section>
        <!-- this year chart -->
        <section class="card p-4 mt-7"><div class="flex justify-between items-baseline"><p class="font-extrabold">This year</p><p class="text-muted text-[13px]">books per month</p></div>
          <div class="bars thin h-[96px] mt-4" id="months" aria-hidden="true"></div>
          <div class="barl thin mt-2 text-[11px] font-semibold text-muted" id="months-l"></div></section>
        <!-- settings -->
        <section class="card p-4 mt-4 space-y-4" aria-label="Settings">
          <div class="flex items-center justify-between gap-3"><span class="font-bold">Theme</span>
            <div class="seg" id="theme-seg"><button type="button" data-t="light">Light</button><button type="button" data-t="dark">Dark</button><button type="button" data-t="system">Auto</button></div></div>
          <div class="flex items-center justify-between gap-3"><span class="font-bold">Daily goal <span class="text-muted font-medium">(min)</span></span>
            <div class="stepper" id="goal" data-min="5" data-max="180" data-step="5" data-val="30"><button type="button" data-dec aria-label="Less">−</button><output class="num">30</output><button type="button" data-inc aria-label="More">+</button></div></div>
          <button type="button" class="pill pill-line pill-sm w-full" id="reset">Reset demo data</button>
        </section>
      </div>
    </div>
  </main>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/profile.js"></script>
</body>
</html>

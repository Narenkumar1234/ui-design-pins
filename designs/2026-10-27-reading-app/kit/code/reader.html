<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect x=%224%22 y=%222%22 width=%2216%22 height=%2220%22 rx=%223%22 fill=%22%23141414%22/%3E%3Ccircle cx=%2212%22 cy=%2211%22 r=%224%22 fill=%22%23E8742A%22/%3E%3C/svg%3E">
  <title>Folio · Reader</title>
</head>
<body data-page="reader" data-nav="read" class="antialiased">
  <header class="sticky top-0 z-20 bg-bg/95 backdrop-blur border-b border-line">
    <div class="max-w-2xl mx-auto px-5 h-[64px] flex items-center justify-between gap-3">
      <a href="index.html" class="btn-round" id="back" aria-label="Back to book"></a>
      <div class="min-w-0 text-center"><p class="label !text-[11px]" id="chap">Chapter 7</p><p class="font-extrabold truncate" id="btitle">The Long Noon</p></div>
      <button type="button" class="btn-round" id="aa" aria-label="Text settings" aria-expanded="false"></button>
    </div>
  </header>
  <main class="max-w-2xl mx-auto px-6 pt-6 pb-56">
    <article class="prose-r" id="text" aria-live="polite"></article>
    <p class="text-muted text-[13px] text-center">Tap a paragraph to highlight it · ← → turn pages</p>
  </main>
  <!-- reading controls -->
  <div class="fixed left-0 right-0 bottom-[92px] z-30 px-4">
    <div class="max-w-[420px] mx-auto card px-4 py-3">
      <div class="track"><i id="bar" style="width:55%"></i></div>
      <div class="flex items-center justify-between mt-2.5 gap-2">
        <button type="button" class="btn-round !w-10 !h-10" id="prev" aria-label="Previous page"></button>
        <p class="text-[13px] font-semibold text-center num" id="pos">p. 143 / 260 · 18 min left</p>
        <button type="button" class="btn-round !w-10 !h-10 !bg-inv !text-oninv !border-transparent" id="next" aria-label="Next page"></button>
      </div>
    </div>
  </div>
  <div class="bottom-fade" aria-hidden="true"></div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/reader.js"></script>
</body>
</html>

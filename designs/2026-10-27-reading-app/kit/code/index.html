<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect x=%224%22 y=%222%22 width=%2216%22 height=%2220%22 rx=%223%22 fill=%22%23141414%22/%3E%3Ccircle cx=%2212%22 cy=%2211%22 r=%224%22 fill=%22%23E8742A%22/%3E%3C/svg%3E">
  <title>Folio · Home</title>
</head>
<body data-page="home" data-nav="home" class="antialiased">
  <main class="max-w-md md:max-w-4xl mx-auto px-5 pt-6 pb-32">
    <!-- greeting -->
    <header class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p id="greet" class="text-muted text-[15px] font-medium">Good evening,</p>
        <h1 id="name" class="h-title text-[32px] truncate">Riya</h1>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle class="btn-round"></button>
        <a href="profile.html" id="avatar" class="w-[42px] h-[42px] rounded-full bg-inv text-oninv grid place-items-center font-extrabold" aria-label="Your profile">R</a>
      </div>
    </header>

    <div class="md:grid md:grid-cols-2 md:gap-6 md:items-start">
      <div>
        <!-- streak card (inverse surface: black in light mode, off-white in dark mode) -->
        <section id="streak" class="mt-6 rounded-[22px] bg-hero text-onhero p-5 dark:border dark:border-line" aria-label="Reading streak">
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 min-w-0">
              <span class="w-11 h-11 rounded-full bg-accent text-[#141414] grid place-items-center flex-none" id="flame"></span>
              <div class="min-w-0"><p class="text-[24px] font-extrabold leading-none"><span id="streak-n" class="num">12</span>-day streak</p>
                <p class="text-[13px] opacity-60 mt-1.5" id="streak-sub">Read today to keep it going</p></div>
            </div>
            <span class="text-[12px] font-bold px-3 h-7 rounded-full grid place-items-center flex-none" style="border:1px solid rgb(var(--onhero) / .25)" id="best">Best 31</span>
          </div>
          <div class="bars h-[60px] mt-5" id="week" aria-hidden="true"></div>
          <div class="barl mt-2 text-[12px] font-semibold" id="week-l"></div>
        </section>

        <!-- currently reading -->
        <section class="mt-7" aria-labelledby="cr-h">
          <div class="flex items-baseline justify-between"><h2 id="cr-h" class="h-title text-[20px]">Currently reading</h2><a href="shelf.html?tab=reading" class="text-[14px] font-semibold text-muted" id="cr-count">3 books</a></div>
          <article class="card p-4 mt-3 flex gap-4" id="current"></article>
        </section>
      </div>

      <div>
        <!-- daily goal -->
        <section class="card p-4 mt-6 flex items-center gap-4" aria-label="Daily goal">
          <div class="relative w-[64px] h-[64px] flex-none">
            <svg viewBox="0 0 36 36" class="w-full h-full -rotate-90" aria-hidden="true"><circle cx="18" cy="18" r="15.5" fill="none" stroke="rgb(var(--soft))" stroke-width="4"/><circle id="ring" cx="18" cy="18" r="15.5" fill="none" stroke="rgb(var(--accent))" stroke-width="4" stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4" style="transition:stroke-dashoffset .6s"/></svg>
            <span class="absolute inset-0 grid place-items-center text-[14px] font-extrabold num" id="ring-pct">73%</span>
          </div>
          <div class="min-w-0 flex-1"><p class="font-extrabold text-[17px]">Daily goal</p><p class="text-muted text-[14px] num" id="goal-txt">22 / 30 min</p></div>
          <button type="button" class="pill pill-line pill-sm" id="log-btn">+ Log</button>
        </section>

        <!-- also reading -->
        <section class="mt-7" aria-labelledby="ar-h">
          <h2 id="ar-h" class="h-title text-[20px]">Also reading</h2>
          <div class="grid gap-3 mt-3" id="others"></div>
        </section>

        <!-- up next -->
        <section class="mt-7" aria-labelledby="un-h">
          <div class="flex items-baseline justify-between"><h2 id="un-h" class="h-title text-[20px]">Up next</h2><a href="shelf.html?tab=want" class="text-[14px] font-semibold text-muted">See all</a></div>
          <div class="hscroll mt-3" id="upnext"></div>
        </section>
      </div>
    </div>
  </main>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>

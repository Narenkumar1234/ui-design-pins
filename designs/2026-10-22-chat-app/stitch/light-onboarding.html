<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Welcome to Natter</title>
<!-- Google Fonts: Montserrat & Public Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols Outlined -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              violet: '#5B3FD0',
              pink: '#FF5C8A',
              orange: '#FF9F43',
              dark: '#1E1B3A',
              muted: '#8A87A6',
              lavender: '#F1F0FF'
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Montserrat", "sans-serif"],
            display: ["Montserrat", "sans-serif"],
            body: ["Montserrat", "sans-serif"],
            label: ["Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    @keyframes subtle-float-1 {
      0%, 100% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-6px) rotate(1deg); }
    }
    @keyframes subtle-float-2 {
      0%, 100% { transform: translateY(0px) rotate(2deg); }
      50% { transform: translateY(5px) rotate(-1deg); }
    }
    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .float-card-1 {
      animation: subtle-float-1 5s ease-in-out infinite;
    }
    .float-card-2 {
      animation: subtle-float-2 6s ease-in-out infinite;
    }
    .pulse-badge {
      animation: pulse-soft 3s ease-in-out infinite;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen p-0 m-0 overflow-hidden font-body antialiased selection:bg-white/20 selection:text-white">
<!-- Mobile Viewport Container: 390x844 strict iPhone frame simulation or standalone mobile screen -->
<main class="w-[390px] h-[844px] max-h-[844px] relative bg-[#5B3FD0] overflow-hidden flex flex-col justify-between select-none shadow-2xl">
<!-- Ambient Graphic Background Accents -->
<div class="absolute -top-24 -right-24 w-80 h-80 rounded-full bg-white/10 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -left-20 w-64 h-64 rounded-full bg-[#FF5C8A]/20 blur-3xl pointer-events-none"></div>
<div class="absolute bottom-12 right-0 w-72 h-72 rounded-full bg-[#FF9F43]/15 blur-3xl pointer-events-none"></div>
<!-- 1. TOP AREA: HERO & PLAYFUL FLAT COMPOSITION (Chat cards, voice pills, initial avatars) -->
<div class="relative w-full h-[410px] pt-12 px-6 flex flex-col items-center justify-center">
<!-- Small floating decorative accent sparks -->
<div class="absolute top-12 left-10 w-2.5 h-2.5 rounded-full bg-white/30"></div>
<div class="absolute top-24 right-14 w-2 h-2 rounded-full bg-[#FF9F43]"></div>
<div class="absolute bottom-6 left-12 w-3 h-3 rounded-full bg-[#FF5C8A]"></div>
<!-- Overlapping Floating Artboard -->
<div class="relative w-full max-w-[340px] h-full flex items-center justify-center">
<!-- Initial Avatars Cluster (No photos, soft gradient circles) -->
<div class="absolute top-4 left-6 flex items-center -space-x-3.5 z-10">
<!-- Avatar 1: SK (Violet to Pink gradient) -->
<div class="relative w-12 h-12 rounded-full bg-gradient-to-tr from-[#5B3FD0] via-[#8553f2] to-[#FF5C8A] p-[2.5px] shadow-lg shadow-black/10">
<div class="w-full h-full rounded-full bg-gradient-to-tr from-[#6841e6] to-[#ec5188] flex items-center justify-center text-white font-headline font-bold text-xs tracking-wider">
              SK
            </div>
<!-- Online status micro dot -->
<span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-[#FF9F43] border-2 border-[#5B3FD0] rounded-full"></span>
</div>
<!-- Avatar 2: AL (Peach to Orange gradient) -->
<div class="relative w-12 h-12 rounded-full bg-gradient-to-tr from-[#FF5C8A] to-[#FF9F43] p-[2.5px] shadow-lg shadow-black/10">
<div class="w-full h-full rounded-full bg-gradient-to-br from-[#FF7A59] to-[#FF9F43] flex items-center justify-center text-white font-headline font-bold text-xs tracking-wider">
              AL
            </div>
</div>
<!-- Avatar 3: JD (Soft Lavender to Violet gradient) -->
<div class="relative w-12 h-12 rounded-full bg-gradient-to-br from-[#E9E6FF] via-[#cfc7fc] to-[#8C75F7] p-[2.5px] shadow-lg shadow-black/10">
<div class="w-full h-full rounded-full bg-gradient-to-tr from-[#9B84FC] to-[#5B3FD0] flex items-center justify-center text-white font-headline font-bold text-xs tracking-wider">
              JD
            </div>
</div>
<!-- Group Call Live Pill Indicator -->
<div class="pl-4">
<span class="inline-flex items-center gap-1.5 px-3 py-1 bg-white/20 backdrop-blur-md rounded-full text-[11px] font-headline font-bold text-white shadow-sm border border-white/20">
<span class="w-2 h-2 rounded-full bg-[#FF5C8A] animate-ping"></span>
              LIVE
            </span>
</div>
</div>
<!-- Chat Bubble 1: Main friendly message (rounded-[18px] with one tight 4px corner) -->
<div class="absolute top-[88px] left-2 right-4 float-card-1 z-20">
<div class="relative bg-white text-[#1E1B3A] p-4 pt-3.5 pb-4 rounded-[18px] rounded-bl-[4px] shadow-xl shadow-black/15 max-w-[285px] border border-white/80">
<div class="flex items-center gap-2 mb-1.5">
<span class="text-[11px] font-headline font-bold text-[#5B3FD0] tracking-wide">Sarah K.</span>
<span class="text-[9px] font-label font-medium text-[#8A87A6]">10:42 AM</span>
</div>
<p class="font-headline font-semibold text-[13.5px] leading-snug tracking-tight text-[#1E1B3A]">
              hey! are you joining the call? 🎧
            </p>
<!-- Reaction Micro Badge: Pink accent ❤️ 2 -->
<div class="absolute -bottom-3 right-3 bg-white px-2.5 py-0.5 rounded-full shadow-md border border-slate-100 flex items-center gap-1">
<span class="text-xs">❤️</span>
<span class="text-[11px] font-headline font-bold text-[#FF5C8A]">2</span>
</div>
</div>
</div>
<!-- Decorative Floating Reaction Chip 1: Sparks -->
<div class="absolute top-[82px] -right-1 z-30 pulse-badge">
<div class="w-9 h-9 rounded-full bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-sm shadow-md">
            ✨
          </div>
</div>
<!-- Chat Bubble 2: Voice Note Audio snippet Graphic -->
<div class="absolute bottom-6 right-2 left-10 float-card-2 z-20 flex justify-end">
<div class="bg-white/95 backdrop-blur-sm text-[#1E1B3A] px-4 py-3 rounded-[18px] rounded-br-[4px] shadow-2xl shadow-black/20 flex items-center gap-3.5 border border-white/90">
<!-- Play Button Circle -->
<button class="w-9 h-9 rounded-full bg-[#5B3FD0] flex items-center justify-center text-white shadow-md active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px] leading-none" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Wave Audio Bars Snippet -->
<div class="flex flex-col gap-1">
<div class="flex items-center gap-[3px] h-5 px-0.5">
<span class="w-[3px] h-2 bg-[#5B3FD0] rounded-full"></span>
<span class="w-[3px] h-3.5 bg-[#5B3FD0] rounded-full"></span>
<span class="w-[3px] h-5 bg-[#5B3FD0] rounded-full"></span>
<span class="w-[3px] h-3 bg-[#5B3FD0] rounded-full"></span>
<span class="w-[3px] h-4 bg-[#FF9F43] rounded-full"></span>
<span class="w-[3px] h-2 bg-slate-300 rounded-full"></span>
<span class="w-[3px] h-4.5 bg-slate-300 rounded-full"></span>
<span class="w-[3px] h-3 bg-slate-300 rounded-full"></span>
<span class="w-[3px] h-1.5 bg-slate-300 rounded-full"></span>
</div>
<span class="text-[10px] font-label font-semibold text-[#8A87A6] tracking-tight">0:24 ılıılı</span>
</div>
<!-- Accent badge -->
<div class="bg-[#FF9F43]/15 text-[#FF9F43] rounded-full px-2 py-0.5 text-[10px] font-headline font-bold flex items-center gap-0.5 ml-1">
              Voice
            </div>
</div>
</div>
<!-- Decorative Floating Emoji Reaction Chip 2: Fire -->
<div class="absolute bottom-20 left-4 z-30 pulse-badge">
<div class="px-2.5 py-1 rounded-full bg-white shadow-lg border border-slate-100 flex items-center gap-1">
<span class="text-xs">🔥</span>
<span class="text-[10px] font-headline font-extrabold text-[#FF9F43]">HOT</span>
</div>
</div>
</div>
</div>
<!-- 2. CONTENT AREA (Lower-middle): Headline, Copy, Dots Pagination -->
<div class="relative px-8 pt-2 pb-6 z-20 flex flex-col">
<!-- Brand Tag / Top Mark -->
<div class="flex items-center gap-2 mb-4">
<span class="w-2.5 h-2.5 rounded-full bg-[#FF9F43]"></span>
<span class="font-headline font-black text-xs text-white/80 uppercase tracking-widest">Natter</span>
</div>
<!-- 2-Line Bold Headline -->
<h1 class="font-headline font-black text-[38px] leading-[1.08] text-white tracking-tight mb-3">
        Talk more,<br/>
        type less.
      </h1>
<!-- Translucent Subtitle -->
<p class="font-body font-normal text-[15px] leading-relaxed text-white/80 max-w-[290px] mb-8">
        Voice notes, reactions and group calls for your crew.
      </p>
<!-- Pagination Indicator Dots: Elongated Active Pill + 2 Dots -->
<div aria-label="Step pagination" class="flex items-center gap-2">
<div class="w-7 h-2 bg-white rounded-full transition-all duration-300"></div>
<div class="w-2 h-2 bg-white/35 rounded-full"></div>
<div class="w-2 h-2 bg-white/35 rounded-full"></div>
</div>
</div>
<!-- 3. BOTTOM NAVIGATION / ACTIONS: Generous Padding Row -->
<div class="relative w-full px-8 pb-9 pt-2 z-20 flex items-center justify-between">
<!-- Bottom-Left: Subtle Text Button/Link -->
<button class="text-white/75 hover:text-white font-headline font-semibold text-sm tracking-wide transition-colors py-2 active:opacity-75">
        Log in
      </button>
<!-- Bottom-Right: Large Prominent Circular White CTA Button -->
<a aria-label="Get Started" class="w-16 h-16 rounded-full bg-white shadow-2xl shadow-black/25 flex items-center justify-center text-[#5B3FD0] hover:scale-105 active:scale-95 transition-all duration-200 group focus:outline-none" href="#get-started">
<span class="material-symbols-outlined text-[28px] font-bold group-hover:translate-x-0.5 transition-transform" style="font-variation-settings: 'wght' 700;">arrow_forward</span>
</a>
</div>
</main>
</body></html>

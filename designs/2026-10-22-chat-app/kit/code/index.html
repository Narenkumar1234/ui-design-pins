<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%235B3FD0%22/%3E%3C/svg%3E">
  <title>Natter · Messages</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <main class="max-w-md md:max-w-2xl mx-auto px-5 pt-5 pb-32">
    <!-- Header -->
    <header class="flex items-center justify-between">
      <h1 class="text-[30px] md:text-[38px] font-bold tracking-[-0.02em] leading-none relative">Messages<i class="absolute -right-3 top-0 w-2 h-2 rounded-full bg-pink"></i></h1>
      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle class="btn-round"></button>
        <button type="button" id="find" class="btn-round" aria-label="Search chats"><svg class="icon text-[20px]"><use href="#i-search"/></svg></button>
        <button type="button" id="new-chat" class="btn-round v" aria-label="New chat"><svg class="icon text-[22px]"><use href="#i-plus"/></svg></button>
      </div>
    </header>

    <!-- Pill search -->
    <label class="search mt-5" for="q">
      <svg class="icon text-[19px] text-muted"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
      <button type="button" id="q-mic" class="w-8 h-8 grid place-items-center text-muted" aria-label="Voice search"><svg class="icon text-[18px]"><use href="#i-mic"/></svg></button>
    </label>

    <!-- Stories / status row -->
    <section id="stories" class="mt-5" aria-label="Stories">
      <div id="story-row" class="flex gap-4 overflow-x-auto no-scrollbar -mx-5 px-5 pb-1"></div>
    </section>

    <!-- Filters -->
    <div id="filters" class="flex gap-2 mt-4 overflow-x-auto no-scrollbar -mx-5 px-5" role="group" aria-label="Filter chats">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="unread" aria-pressed="false">Unread <b id="unread-n">0</b></button>
      <button type="button" class="chip" data-filter="groups" aria-pressed="false">Groups</button>
      <button type="button" class="chip" data-filter="pinned" aria-pressed="false">Pinned</button>
    </div>

    <!-- Chat list -->
    <section class="mt-4">
      <ul id="list" class="grid gap-2.5 md:grid-cols-2"></ul>
      <p id="empty" class="hidden text-center text-muted text-[14px] py-12">No chats here. <button type="button" id="clear" class="text-deep font-medium">Show all</button></p>
    </section>
  </main>

  <!-- Chat actions sheet (long-press / right-click a chat) -->
  <div id="act-scrim" class="scrim fixed inset-0 z-50 bg-black/40"></div>
  <div id="act" class="sheet fixed z-[60] bottom-0 inset-x-0 max-w-md mx-auto bg-surface rounded-t-[28px] px-5 pt-3 pb-8" role="dialog" aria-modal="true" aria-label="Chat actions" aria-hidden="true">
    <span class="block w-10 h-1.5 rounded-full bg-line mx-auto"></span>
    <div id="act-head" class="flex items-center gap-3 mt-4"></div>
    <div class="mt-4 rounded-[20px] bg-bg overflow-hidden">
      <button type="button" class="set-row" data-act="pin"><span class="set-ico"><svg class="icon"><use href="#i-pin"/></svg></span><span id="act-pin" class="font-medium text-[14.5px]">Pin chat</span></button>
      <button type="button" class="set-row" data-act="read"><span class="set-ico"><svg class="icon"><use href="#i-checks"/></svg></span><span id="act-read" class="font-medium text-[14.5px]">Mark as read</span></button>
      <button type="button" class="set-row" data-act="mute"><span class="set-ico"><svg class="icon"><use href="#i-belloff"/></svg></span><span id="act-mute" class="font-medium text-[14.5px]">Mute</span></button>
      <button type="button" class="set-row" data-act="delete"><span class="set-ico !bg-pink/10 !text-pink"><svg class="icon"><use href="#i-trash"/></svg></span><span class="font-medium text-[14.5px] text-pink">Delete chat</span></button>
    </div>
  </div>

  <!-- New chat / new group sheet -->
  <div id="new-scrim" class="scrim fixed inset-0 z-50 bg-black/40"></div>
  <div id="new" class="sheet fixed z-[60] bottom-0 inset-x-0 max-w-md mx-auto bg-surface rounded-t-[28px] px-5 pt-3 pb-8 max-h-[86vh] overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="new-title" aria-hidden="true">
    <span class="block w-10 h-1.5 rounded-full bg-line mx-auto"></span>
    <div class="flex items-center justify-between mt-4">
      <h2 id="new-title" class="text-[20px] font-semibold">New chat</h2>
      <button type="button" data-close class="btn-round !bg-raised !shadow-none" aria-label="Close"><svg class="icon text-[18px]"><use href="#i-close"/></svg></button>
    </div>
    <div class="seg mt-4 !bg-raised" role="tablist">
      <button type="button" role="tab" data-mode="dm" aria-selected="true">Message</button>
      <button type="button" role="tab" data-mode="group" aria-selected="false">New group</button>
    </div>
    <input id="group-name" class="field mt-4 hidden" placeholder="Group name" maxlength="28" aria-label="Group name">
    <p id="new-hint" class="text-[12.5px] text-muted mt-4">Pick someone to start chatting.</p>
    <ul id="contacts" class="mt-2 grid gap-1"></ul>
    <p id="new-err" class="text-pink text-[13px] mt-2 min-h-[18px]" role="alert"></p>
    <button type="button" id="create-group" class="pill-primary w-full h-[52px] rounded-full font-semibold text-[15px] mt-1 hidden">Create group</button>
  </div>

  <!-- Add a text story -->
  <div id="add-story-scrim" class="scrim fixed inset-0 z-50 bg-black/40"></div>
  <div id="add-story" class="sheet fixed z-[60] bottom-0 inset-x-0 max-w-md mx-auto bg-surface rounded-t-[28px] px-5 pt-3 pb-8" role="dialog" aria-modal="true" aria-label="Add story" aria-hidden="true">
    <span class="block w-10 h-1.5 rounded-full bg-line mx-auto"></span>
    <h2 class="text-[20px] font-semibold mt-4">Your story</h2>
    <div id="story-preview" class="mt-4 h-40 rounded-[22px] grid place-items-center text-white text-[20px] font-semibold px-6 text-center" style="background:linear-gradient(135deg,#5B3FD0,#B39BFF)">Say something</div>
    <input id="story-text" class="field mt-3" placeholder="Type a status…" maxlength="60" aria-label="Story text">
    <div id="story-bgs" class="flex gap-2 mt-3" role="group" aria-label="Background"></div>
    <p id="story-err" class="text-pink text-[13px] mt-2 min-h-[18px]" role="alert"></p>
    <button type="button" id="post-story" class="pill-primary w-full h-[52px] rounded-full font-semibold text-[15px]">Share story</button>
  </div>

  <!-- Story viewer -->
  <div id="viewer" class="overlay fixed inset-0 z-[80] bg-[#0E0A1F] text-white" role="dialog" aria-modal="true" aria-label="Story" aria-hidden="true">
    <div class="relative h-full max-w-md mx-auto flex flex-col">
      <div id="v-bg" class="absolute inset-0 bg-cover bg-center"></div>
      <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/50"></div>
      <div class="relative z-10 px-4 pt-4"><div id="v-bars" class="flex gap-1"></div>
        <div class="flex items-center gap-3 mt-3"><span id="v-av"></span><span class="min-w-0"><b id="v-name" class="block text-[14px] font-semibold"></b><small id="v-time" class="text-white/70 text-[12px]"></small></span>
          <button type="button" id="v-close" class="ml-auto btn-round glass" aria-label="Close story"><svg class="icon text-[20px]"><use href="#i-close"/></svg></button></div></div>
      <button type="button" id="v-prev" class="absolute z-10 left-0 top-24 bottom-28 w-1/3" aria-label="Previous story"></button>
      <button type="button" id="v-next" class="absolute z-10 right-0 top-24 bottom-28 w-2/3" aria-label="Next story"></button>
      <p id="v-text" class="relative z-10 mt-auto mb-6 px-6 text-[24px] font-semibold leading-tight"></p>
      <form id="v-reply" class="relative z-20 px-4 pb-6 flex gap-2"><input id="v-input" class="flex-1 h-12 rounded-full bg-white/15 backdrop-blur px-5 outline-none placeholder:text-white/60 text-[14px]" placeholder="Reply…" aria-label="Reply to story">
        <button class="send" aria-label="Send reply"><svg class="icon text-[19px]"><use href="#i-send"/></svg></button></form>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/chats.js"></script>
</body>
</html>

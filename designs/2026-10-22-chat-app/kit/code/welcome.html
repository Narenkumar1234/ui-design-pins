<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%235B3FD0%22/%3E%3C/svg%3E">
  <title>Natter · Welcome</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <!-- Welcome: full-violet onboarding, floating chat-bubble illustration, 3 intro steps, round white arrow button -->
  <main class="welcome relative min-h-screen max-w-md mx-auto overflow-hidden flex flex-col">
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-white/[.06]"></div>
    <div class="absolute top-64 -left-28 w-64 h-64 rounded-full bg-white/[.05]"></div>
    <header class="relative z-10 flex items-center justify-between px-6 pt-5">
      <span class="flex items-center gap-2 font-semibold text-[18px] tracking-tight"><span class="w-7 h-7 rounded-[10px] rounded-bl-[3px] bg-white text-[#5B3FD0] grid place-items-center"><svg class="icon text-[16px]"><use href="#i-chat"/></svg></span>natter</span>
      <a href="index.html" id="skip" class="h-9 px-4 rounded-full bg-white/15 grid place-items-center text-[13px] font-medium">Skip</a>
    </header>

    <!-- Illustration: floating cards built from real UI pieces (avatars, bubble, voice note, reactions) -->
    <div id="art" class="relative z-10 mx-6 mt-6 h-[330px]" aria-hidden="true">
      <div class="float absolute left-0 top-2 flex items-center">
        <span id="art-avs" class="flex -space-x-3"></span>
        <span class="ml-3 h-7 px-3 rounded-full bg-white/15 text-[11px] font-semibold tracking-wide flex items-center gap-1.5"><i class="w-1.5 h-1.5 rounded-full bg-[#FF9F43]"></i>LIVE</span>
      </div>
      <div class="float d2 absolute left-0 right-8 top-[74px] bg-white text-[#1E1B3A] rounded-[20px] rounded-bl-[4px] px-4 py-3 shadow-[0_24px_40px_-20px_rgba(20,10,60,.6)]">
        <p class="text-[11px] font-semibold text-[#5B3FD0]">Maya · 10:42</p>
        <p class="text-[14px] mt-0.5">are you joining the call tonight?</p>
        <span class="absolute -bottom-3 right-5 h-6 px-2 rounded-full bg-white text-[12px] font-semibold text-[#1E1B3A] flex items-center gap-1 shadow-md"><span class="emoji">❤️</span><span>2</span></span>
      </div>
      <div class="float d3 absolute right-0 top-[196px] w-[210px] bg-white rounded-[20px] rounded-br-[4px] px-3 py-2.5 flex items-center gap-2.5 shadow-[0_24px_40px_-20px_rgba(20,10,60,.6)]">
        <span class="w-9 h-9 rounded-full bg-[#5B3FD0] text-white grid place-items-center"><svg class="icon fill text-[15px]"><use href="#i-play"/></svg></span>
        <span class="flex items-center gap-[3px] h-6 text-[#5B3FD0]" id="art-wave"></span><span class="text-[11px] text-[#8A87A6] ml-auto">0:24</span>
      </div>
      <span class="float absolute left-6 top-[214px] h-9 px-3 rounded-full bg-[#FF5C8A] text-white text-[13px] font-semibold flex items-center gap-1.5 shadow-lg"><span class="emoji">🔥</span><span>12</span></span>
      <span class="float d2 absolute left-28 top-[282px] w-3 h-3 rounded-full bg-[#FF9F43]"></span>
      <span class="float d3 absolute right-10 top-[48px] w-2.5 h-2.5 rounded-full bg-[#FF5C8A]"></span>
    </div>

    <div class="relative z-10 mt-auto px-6 pb-10">
      <h1 id="ob-title" class="text-[40px] font-bold leading-[1.08] tracking-[-0.02em] min-h-[88px]">Talk more,<br>type less.</h1>
      <p id="ob-text" class="text-[15px] text-white/75 font-light mt-3 min-h-[46px] max-w-[300px]">Voice notes, reactions and group calls for your whole crew.</p>
      <div class="dots mt-6" id="dots" role="tablist" aria-label="Intro steps"></div>
      <div class="flex items-center justify-between mt-8">
        <a href="index.html" id="login" class="text-[15px] font-medium text-white/90">Log in</a>
        <button type="button" id="go" class="go" aria-label="Next">
          <svg class="prog" viewBox="0 0 88 88"><circle cx="44" cy="44" r="42" stroke-dasharray="264" stroke-dashoffset="176" id="prog"/></svg>
          <svg class="icon text-[28px]"><use href="#i-arrow"/></svg>
        </button>
      </div>
    </div>
  </main>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/welcome.js"></script>
</body>
</html>

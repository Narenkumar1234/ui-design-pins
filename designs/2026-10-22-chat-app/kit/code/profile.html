<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2212%22 fill=%22%235B3FD0%22/%3E%3C/svg%3E">
  <title>Natter · Profile</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <main class="max-w-md md:max-w-2xl mx-auto px-5 pt-5 pb-32">
    <header class="flex items-center justify-between">
      <h1 class="text-[30px] md:text-[38px] font-bold tracking-[-0.02em] leading-none">Profile</h1>
      <button type="button" data-theme-toggle class="btn-round"></button>
    </header>

    <!-- Identity card -->
    <section class="mt-5 bg-surface rounded-[26px] p-5 flex flex-col items-center text-center shadow-card">
      <button type="button" id="edit" class="relative" aria-label="Edit profile">
        <span class="ring !p-1 block" id="me-av"></span>
        <i class="absolute right-0.5 bottom-0.5 w-8 h-8 rounded-full bg-primary text-white grid place-items-center ring-4 ring-surface"><svg class="icon text-[15px]"><use href="#i-edit"/></svg></i>
      </button>
      <h2 id="me-name" class="text-[22px] font-semibold mt-3">Aarav Kumar</h2>
      <p class="text-muted text-[13px]"><span id="me-handle">@aarav</span></p>
      <button type="button" id="status" class="mt-2 h-8 px-3.5 rounded-full bg-primary/10 text-deep text-[13px] font-medium flex items-center gap-2" aria-label="Change status"><i class="w-2 h-2 rounded-full bg-ok"></i><span id="status-t">Available</span><svg class="icon text-[14px]"><use href="#i-chevron"/></svg></button>
      <p id="me-bio" class="text-[13.5px] text-muted font-light mt-3 max-w-[280px]"></p>
      <div class="grid grid-cols-3 w-full mt-5 pt-4 border-t border-line">
        <div><b id="n-chats" class="block text-[19px] font-semibold">0</b><small class="text-muted text-[12px]">Chats</small></div>
        <div><b id="n-groups" class="block text-[19px] font-semibold">0</b><small class="text-muted text-[12px]">Groups</small></div>
        <div><b id="n-media" class="block text-[19px] font-semibold">0</b><small class="text-muted text-[12px]">Media</small></div>
      </div>
    </section>

    <h3 class="text-[13px] font-semibold text-muted uppercase tracking-[.12em] mt-6 mb-2 px-1">Privacy</h3>
    <div class="bg-surface rounded-[22px] shadow-card">
      <div class="set-row"><span class="set-ico"><svg class="icon"><use href="#i-eye"/></svg></span><span class="flex-1"><b class="block font-medium text-[14.5px]">Last seen</b><small class="text-muted text-[12px]">Friends see when you were online</small></span><button type="button" class="switch" role="switch" data-set="lastSeen" aria-label="Last seen"></button></div>
      <div class="set-row"><span class="set-ico"><svg class="icon"><use href="#i-checks"/></svg></span><span class="flex-1"><b class="block font-medium text-[14.5px]">Read receipts</b><small class="text-muted text-[12px]">Blue ticks when you read</small></span><button type="button" class="switch" role="switch" data-set="receipts" aria-label="Read receipts"></button></div>
    </div>

    <h3 class="text-[13px] font-semibold text-muted uppercase tracking-[.12em] mt-6 mb-2 px-1">Preferences</h3>
    <div class="bg-surface rounded-[22px] shadow-card">
      <div class="set-row"><span class="set-ico"><svg class="icon"><use href="#i-bell"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Notifications</span><button type="button" class="switch" role="switch" data-set="notify" aria-label="Notifications"></button></div>
      <div class="set-row"><span class="set-ico"><svg class="icon"><use href="#i-chat"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Message previews</span><button type="button" class="switch" role="switch" data-set="preview" aria-label="Message previews"></button></div>
      <div class="set-row"><span class="set-ico"><svg class="icon"><use href="#i-moon"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Dark mode</span><button type="button" class="switch" role="switch" data-theme-toggle aria-label="Dark mode"></button></div>
      <div class="set-row !flex-wrap"><span class="set-ico"><svg class="icon"><use href="#i-palette"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Chat wallpaper</span>
        <div id="wall" class="seg !bg-raised !p-1 w-full sm:w-auto" role="radiogroup" aria-label="Chat wallpaper">
          <button type="button" role="radio" data-wall="plain" class="!h-8 !px-3">Plain</button><button type="button" role="radio" data-wall="dots" class="!h-8 !px-3">Dots</button><button type="button" role="radio" data-wall="violet" class="!h-8 !px-3">Violet</button></div></div>
    </div>

    <h3 class="text-[13px] font-semibold text-muted uppercase tracking-[.12em] mt-6 mb-2 px-1">More</h3>
    <div class="bg-surface rounded-[22px] shadow-card">
      <button type="button" class="set-row" id="storage"><span class="set-ico"><svg class="icon"><use href="#i-db"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Storage and data</span><small id="storage-kb" class="text-muted text-[12.5px]"></small></button>
      <button type="button" class="set-row" id="help"><span class="set-ico"><svg class="icon"><use href="#i-help"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Help and feedback</span><svg class="icon text-muted"><use href="#i-chevron"/></svg></button>
      <button type="button" class="set-row" id="reset"><span class="set-ico"><svg class="icon"><use href="#i-trash"/></svg></span><span class="flex-1 font-medium text-[14.5px]">Reset demo data</span></button>
      <button type="button" class="set-row" id="logout"><span class="set-ico !bg-pink/10 !text-pink"><svg class="icon"><use href="#i-logout"/></svg></span><span class="flex-1 font-medium text-[14.5px] text-pink">Log out</span></button>
    </div>
  </main>

  <!-- Edit profile sheet -->
  <div id="ed-scrim" class="scrim fixed inset-0 z-50 bg-black/40"></div>
  <div id="ed" class="sheet fixed z-[60] bottom-0 inset-x-0 max-w-md mx-auto bg-surface rounded-t-[28px] px-5 pt-3 pb-8" role="dialog" aria-modal="true" aria-label="Edit profile" aria-hidden="true">
    <span class="block w-10 h-1.5 rounded-full bg-line mx-auto"></span>
    <h2 class="text-[20px] font-semibold mt-4">Edit profile</h2>
    <label class="block text-[12.5px] text-muted mt-4" for="ed-name">Name</label><input id="ed-name" class="field mt-1" maxlength="30">
    <label class="block text-[12.5px] text-muted mt-3" for="ed-bio">Bio</label><input id="ed-bio" class="field mt-1" maxlength="70">
    <p id="ed-err" class="text-pink text-[13px] mt-2 min-h-[18px]" role="alert"></p>
    <button type="button" id="ed-save" class="pill-primary w-full h-[52px] rounded-full font-semibold text-[15px]">Save</button>
  </div>

  <!-- Status sheet -->
  <div id="st-scrim" class="scrim fixed inset-0 z-50 bg-black/40"></div>
  <div id="st" class="sheet fixed z-[60] bottom-0 inset-x-0 max-w-md mx-auto bg-surface rounded-t-[28px] px-5 pt-3 pb-8" role="dialog" aria-modal="true" aria-label="Status" aria-hidden="true">
    <span class="block w-10 h-1.5 rounded-full bg-line mx-auto"></span>
    <h2 class="text-[20px] font-semibold mt-4">Set a status</h2>
    <div id="st-list" class="flex flex-wrap gap-2 mt-4"></div>
  </div>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4FA3F7">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%23FFB238%22/%3E%3C/svg%3E">
  <title>Nimbus · Cities</title>
</head>
<body data-page="cities" class="antialiased">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-5 pb-32">
    <header class="flex items-center justify-between gap-3">
      <h1 class="text-[30px] font-semibold tracking-[-0.03em] leading-none">Cities</h1>
      <div class="flex items-center gap-2">
        <button type="button" id="edit" class="btn-ghost" aria-pressed="false">Edit</button>
        <button type="button" data-theme-toggle class="btn-round"></button>
      </div>
    </header>

    <form id="search" class="glass mt-5 flex items-center gap-2 h-[54px] px-4" style="border-radius:999px" role="search" autocomplete="off">
      <span id="s-ic" class="text-muted"></span>
      <label for="q" class="sr-only">Search for a city</label>
      <input id="q" type="search" placeholder="Search for a city" class="flex-1 min-w-0 bg-transparent outline-none text-[15px] placeholder:text-muted/80" aria-controls="results">
      <button type="button" id="clear" class="hidden w-8 h-8 grid place-items-center rounded-full text-muted" aria-label="Clear search"></button>
    </form>

    <section id="results-wrap" class="hidden mt-3" aria-live="polite">
      <ul id="results" class="glass p-2" style="border-radius:24px"></ul>
      <p id="empty" class="hidden glass hi text-center text-[14px] py-6 px-4" style="border-radius:24px">No city called “<b id="empty-q"></b>”. Try Paris, Tokyo or Pune.</p>
    </section>

    <div class="flex items-center justify-between mt-6 px-1">
      <h2 class="label">Saved · <span id="count">6</span></h2>
      <p id="hint" class="text-[12px] text-muted">Tap a city to open it</p>
    </div>
    <ul id="list" class="grid gap-3 mt-3 md:grid-cols-2"></ul>
  </main>
  <nav id="nav"></nav>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/cities.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4FA3F7">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%23FFB238%22/%3E%3C/svg%3E">
  <title>Nimbus · Weather</title>
</head>
<body data-page="index" class="antialiased">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-5 pb-32">
    <header class="flex items-start justify-between gap-3">
      <button type="button" id="refresh" class="btn-round" aria-label="Refresh weather"></button>
      <a href="cities.html" id="loc" class="min-w-0 text-center pt-0.5" aria-label="Change city">
        <span id="loc-label" class="label flex items-center justify-center gap-1"><span id="loc-pin"></span><span id="loc-kind">My location</span></span>
        <span class="flex items-center justify-center gap-1 text-[24px] font-semibold tracking-[-0.02em] mt-0.5"><span id="city" class="truncate">Bengaluru</span><span id="loc-chev" class="text-muted"></span></span>
        <span id="date" class="block text-[12px] text-muted">Saturday, 24 Oct · 13:00</span>
      </a>
      <button type="button" data-theme-toggle class="btn-round"></button>
    </header>
    <div id="pager" class="dots mt-3" role="tablist" aria-label="Saved cities"></div>

    <div class="md:grid md:grid-cols-2 md:gap-6 md:items-start">
      <div>
        <!-- hero: swipe left/right (or arrow keys) to switch saved cities, tap the temperature to switch °C / °F -->
        <section id="hero" class="text-center mt-1 select-none" style="touch-action: pan-y">
          <div id="hero-icon" class="flex justify-center -mb-2"></div>
          <button type="button" id="temp-btn" class="relative inline-block" aria-label="Switch temperature unit">
            <span id="temp" class="num text-[96px] block">27</span><span class="absolute -right-7 top-0.5 text-[50px] font-extralight leading-none">°</span>
          </button>
          <p id="cond" class="text-[18px] font-medium">Partly cloudy</p>
          <p id="hilo" class="text-[14px] text-muted mt-1">H 28° · L 20° · Feels 29°</p>
          <button type="button" id="back-now" class="btn-ghost hidden mt-3 h-8 text-[12px]"></button>
        </section>
        <!-- Highlights: plain-language summary of the next hours (rain alert + tomorrow's trend), dismissible per city per day -->
        <section id="alert" class="glass hi mt-4 p-4 pt-3.5 hidden" style="border-radius:24px" aria-labelledby="h-hl">
          <div class="flex items-center justify-between"><h2 id="h-hl" class="label flex items-center gap-1.5"><span id="hl-ic"></span>Highlights</h2>
            <button type="button" id="alert-x" class="w-8 h-8 -my-1 -mr-1.5 grid place-items-center rounded-full text-muted" aria-label="Dismiss highlights"></button></div>
          <ul class="mt-2 grid gap-1.5 text-[13px] leading-snug">
            <li id="hl-rain" class="flex gap-2.5 items-start"><span id="alert-ic" class="flex-none mt-px"></span><span><b id="alert-t" class="font-semibold">Rain likely around 16:00</b> <span id="alert-s" class="text-muted"></span></span></li>
            <li class="flex gap-2.5 items-start"><span id="trend-ic" class="flex-none mt-px"></span><span id="trend" class="text-muted"></span></li>
          </ul>
        </section>
      </div>
      <div>
        <section id="stats" class="glass mt-3 grid grid-cols-3 py-3.5" aria-label="Current conditions"></section>
        <section class="glass mt-3 p-4 pb-3" aria-labelledby="h-hourly">
          <div class="flex items-center justify-between gap-2 px-1"><h2 id="h-hourly" class="label">Hourly</h2>
            <div class="seg !p-[3px]" role="tablist" aria-label="Hourly detail" id="hm"><button type="button" role="tab" data-hm="cond" class="!h-7 !px-2.5" aria-label="Conditions"></button><button type="button" role="tab" data-hm="rain" class="!h-7 !px-2.5" aria-label="Rain chance"></button><button type="button" role="tab" data-hm="wind" class="!h-7 !px-2.5" aria-label="Wind"></button></div>
            <a href="forecast.html" class="text-[12px] font-semibold flex items-center gap-0.5">10 days <span id="ch1"></span></a></div>
          <div id="hours" class="hours mt-3" role="group" aria-label="Next 24 hours"></div>
        </section>
        <section class="glass mt-4 p-4" aria-labelledby="h-next">
          <div class="flex items-center justify-between px-1"><h2 id="h-next" class="label">Next days</h2><a href="forecast.html" class="text-[12px] font-semibold">See all</a></div>
          <ul id="next" class="mt-2"></ul>
        </section>
        <div class="grid grid-cols-2 gap-4 mt-4">
          <a href="details.html#aqi" id="mini-aqi" class="glass p-4 block"></a>
          <a href="details.html#uv" id="mini-uv" class="glass p-4 block"></a>
        </div>
        <p id="src" class="text-center text-[11px] text-muted mt-5"></p>
      </div>
    </div>
  </main>
  <nav id="nav"></nav>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>

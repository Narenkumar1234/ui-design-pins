<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4FA3F7">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22 fill=%22%23FFB238%22/%3E%3C/svg%3E">
  <title>Nimbus · Forecast</title>
</head>
<body data-page="forecast" class="antialiased">
  <main class="max-w-md md:max-w-3xl mx-auto px-5 pt-5 pb-32">
    <header class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-[30px] font-semibold tracking-[-0.03em] leading-none">Forecast</h1>
        <p id="sub" class="text-[13px] text-muted mt-1.5 truncate">Bengaluru · Saturday, 24 Oct</p>
      </div>
      <button type="button" data-theme-toggle class="btn-round"></button>
    </header>

    <div class="seg mt-5" role="tablist" aria-label="Chart metric">
      <button type="button" role="tab" data-metric="temp" aria-selected="true">Temperature</button>
      <button type="button" role="tab" data-metric="rain" aria-selected="false">Rain</button>
      <button type="button" role="tab" data-metric="wind" aria-selected="false">Wind</button>
    </div>

    <div class="md:grid md:grid-cols-2 md:gap-5 md:items-start">
      <section class="glass mt-4 p-4" aria-labelledby="h-chart">
        <div class="flex items-center justify-between gap-3 px-1">
          <div class="min-w-0"><h2 id="h-chart" class="label">Next 24 hours</h2>
            <p class="mt-2 flex items-baseline gap-2"><b id="read-v" class="text-[30px] font-light tracking-[-0.04em] leading-none">27°</b><span id="read-t" class="text-[13px] text-muted truncate">Now · Partly cloudy</span></p></div>
          <span id="read-ic"></span>
        </div>
        <div id="chart-wrap" class="relative mt-3">
          <svg id="chart" viewBox="0 0 340 170" class="w-full h-auto block cursor-crosshair outline-none" tabindex="0" role="slider" aria-label="Hour" aria-valuemin="0" aria-valuemax="23" aria-valuenow="0"></svg>
          <div id="tip" class="chart-tip"></div>
        </div>
        <p class="text-[11px] text-muted text-center mt-1">Tap or drag the chart · ← → to move</p>
      </section>

      <section class="glass mt-4 p-3 md:p-4" aria-labelledby="h-days">
        <h2 id="h-days" class="label px-2 pt-1">10-day forecast</h2>
        <ul id="days" class="mt-1.5"></ul>
      </section>
    </div>
  </main>
  <nav id="nav"></nav>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/forecast.js"></script>
</body>
</html>

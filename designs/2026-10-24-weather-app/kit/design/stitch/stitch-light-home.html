<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Nimbus Weather</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@500;600;700&amp;family=Sora:wght@200;300;400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              ink: '#0F2A4A',
              muted: '#4D6A8C',
              sun: '#FFB238',
              aqiGreen: '#3DD68C',
              aqiYellow: '#FFD54A',
              aqiOrange: '#FF8A3D'
            }
          },
          borderRadius: {
            "DEFAULT": "1rem",
            "lg": "2rem",
            "xl": "3rem",
            "28": "28px",
            "full": "9999px"
          },
          fontFamily: {
            headline: ["Sora", "sans-serif"],
            display: ["Sora", "sans-serif"],
            body: ["Sora", "sans-serif"],
            label: ["Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .material-symbols-fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.24);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 10px 32px 0 rgba(15, 42, 74, 0.08), inset 0 1px 1px 0 rgba(255, 255, 255, 0.6);
    }
    .glass-pill-nav {
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 12px 30px -4px rgba(15, 42, 74, 0.12);
    }
    .hero-cloud-shadow {
      filter: drop-shadow(0 16px 20px rgba(15, 42, 74, 0.14));
    }
    .sun-glow {
      filter: drop-shadow(0 0 24px rgba(255, 178, 56, 0.65));
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-full bg-[#8CCBFF] text-[#0F2A4A] font-body antialiased flex justify-center items-center select-none overflow-hidden sm:p-4">
<!-- Mobile Viewport Shell (390 x 844) -->
<main class="relative w-[390px] h-[844px] overflow-hidden rounded-[40px] shadow-2xl flex flex-col justify-between px-5 pt-3 pb-6 bg-gradient-to-b from-[#4FA3F7] via-[#8CCBFF] to-[#FFD6A5]">
<!-- Ambient Light Highlights -->
<div class="absolute -top-16 -left-16 w-56 h-56 rounded-full bg-white/20 blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -right-20 w-64 h-64 rounded-full bg-[#FFD6A5]/40 blur-3xl pointer-events-none"></div>
<!-- 1. Top Header -->
<header class="relative z-10 w-full flex justify-between items-center pt-2">
<!-- Location and Date -->
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-full bg-white/30 backdrop-blur-md border border-white/50 flex items-center justify-center text-[#0F2A4A] shadow-xs">
<span class="material-symbols-outlined text-[19px] material-symbols-fill" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<h1 class="font-headline font-bold text-lg text-[#0F2A4A] leading-tight tracking-tight">Bengaluru</h1>
<p class="font-label text-xs font-semibold text-[#4D6A8C]">Sat, 24 Oct</p>
</div>
</div>
<!-- Action Button -->
<button aria-label="Menu" class="w-10 h-10 rounded-full bg-white/25 border border-white/50 backdrop-blur-md flex items-center justify-center text-[#0F2A4A] shadow-sm hover:bg-white/35 active:scale-95 transition duration-150">
<span class="material-symbols-outlined text-xl">widgets</span>
</button>
</header>
<!-- 2. Hero Weather Centerpiece -->
<section class="relative z-10 flex flex-col items-center justify-center my-auto -mt-1">
<!-- 3D Soft Vector Graphic: Sun & Puffy Cloud -->
<div class="relative w-44 h-36 flex items-center justify-center hero-cloud-shadow">
<!-- Sun Accent #FFB238 with warm radiant gradient -->
<div class="absolute top-1 right-7 w-20 h-20 rounded-full bg-gradient-to-tr from-[#FF9800] to-[#FFD54F] sun-glow animate-pulse" style="animation-duration: 4s;">
<div class="w-full h-full rounded-full bg-[#FFB238] opacity-90"></div>
</div>
<!-- Layered Stylized Glassy Cloud (SVG) -->
<svg class="relative z-10 w-44 h-32" fill="none" viewbox="0 0 176 128" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient gradientunits="userSpaceOnUse" id="cloudGradFront" x1="20" x2="150" y1="30" y2="120">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
<stop offset="60%" stop-color="#F2F8FF" stop-opacity="0.88"></stop>
<stop offset="100%" stop-color="#D7EBFF" stop-opacity="0.75"></stop>
</lineargradient>
<lineargradient gradientunits="userSpaceOnUse" id="cloudGradBack" x1="40" x2="140" y1="10" y2="90">
<stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
<stop offset="100%" stop-color="#B6DCFE" stop-opacity="0.6"></stop>
</lineargradient>
<filter height="120%" id="softGaze" width="120%" x="-10%" y="-10%">
<fedropshadow dx="0" dy="8" flood-color="#0F2A4A" flood-opacity="0.12" stddeviation="6"></fedropshadow>
</filter>
</defs>
<!-- Back cloud puff -->
<ellipse cx="64" cy="52" fill="url(#cloudGradBack)" rx="34" ry="32"></ellipse>
<ellipse cx="112" cy="58" fill="url(#cloudGradBack)" rx="30" ry="28"></ellipse>
<!-- Main Front Cloud Body -->
<g filter="url(#softGaze)">
<path d="M46 104C33.8497 104 24 94.1503 24 82C24 70.8256 32.3274 61.6033 43.149 60.1746C44.757 44.2758 58.1996 32 74.5 32C87.4259 32 98.6653 39.7347 103.58 50.8499C107.014 48.4312 111.177 47 115.667 47C126.897 47 136 56.103 136 67.3333C136 68.6823 135.869 70.001 135.619 71.2774C145.029 73.1678 152 81.3323 152 91C152 102.046 143.046 111 132 111H46C40 111 46 104 46 104Z" fill="url(#cloudGradFront)"></path>
</g>
<!-- Subtle Highlights on Puff top -->
<path d="M52 50 C58 40, 72 38, 86 42" opacity="0.6" stroke="#FFFFFF" stroke-linecap="round" stroke-width="2.5"></path>
</svg>
</div>
<!-- Temperature Metric -->
<div class="flex items-start justify-center mt-1">
<span class="font-display font-extralight text-[90px] leading-none text-[#0F2A4A] tracking-tighter" style="font-weight: 200;">27</span>
<span class="font-display font-light text-5xl leading-none text-[#0F2A4A] mt-2 ml-1">°</span>
</div>
<!-- Condition and Range -->
<h2 class="font-headline font-semibold text-xl text-[#0F2A4A] tracking-tight mt-1">Partly cloudy</h2>
<p class="font-label text-xs uppercase tracking-widest font-bold text-[#4D6A8C] mt-0.5">
        H 30° <span class="mx-1 text-[#4D6A8C]/50">•</span> L 21°
      </p>
</section>
<!-- 3. Stat Row (Frosted Glass Panel) -->
<section class="relative z-10 glass-card rounded-[28px] py-3.5 px-4 mb-3.5">
<div class="grid grid-cols-3 divide-x divide-white/40 text-center items-center">
<!-- Wind -->
<div class="flex flex-col items-center px-1">
<div class="flex items-center space-x-1 text-[#4D6A8C] mb-1">
<span class="material-symbols-outlined text-[17px]">air</span>
<span class="font-label text-[10px] tracking-wider uppercase font-bold">Wind</span>
</div>
<span class="font-headline text-sm font-bold text-[#0F2A4A]">12 <span class="text-xs font-semibold text-[#4D6A8C]">km/h</span></span>
</div>
<!-- Humidity -->
<div class="flex flex-col items-center px-1">
<div class="flex items-center space-x-1 text-[#4D6A8C] mb-1">
<span class="material-symbols-outlined text-[17px]">water_drop</span>
<span class="font-label text-[10px] tracking-wider uppercase font-bold">Humidity</span>
</div>
<span class="font-headline text-sm font-bold text-[#0F2A4A]">64%</span>
</div>
<!-- Rain -->
<div class="flex flex-col items-center px-1">
<div class="flex items-center space-x-1 text-[#4D6A8C] mb-1">
<span class="material-symbols-outlined text-[17px]">rainy</span>
<span class="font-label text-[10px] tracking-wider uppercase font-bold">Rain</span>
</div>
<span class="font-headline text-sm font-bold text-[#0F2A4A]">20%</span>
</div>
</div>
</section>
<!-- 4. Hourly Forecast (Frosted Glass Panel) -->
<section class="relative z-10 glass-card rounded-[28px] p-3.5 mb-2">
<!-- Section Title -->
<div class="flex items-center justify-between mb-2.5 px-1">
<span class="font-label text-[11px] font-bold tracking-wider uppercase text-[#4D6A8C]">Hourly Forecast</span>
<span class="font-label text-[11px] font-bold text-[#0F2A4A]/80 cursor-pointer hover:underline">Today</span>
</div>
<!-- Hourly Forecast Row: 5 Pillars -->
<div class="grid grid-cols-5 gap-2">
<!-- Pillar 1: NOW (Active highlighted pill) -->
<div class="bg-white/60 backdrop-blur-md rounded-2xl py-2 px-1 flex flex-col items-center justify-between shadow-sm border border-white/80">
<span class="font-label text-[11px] font-bold text-[#0F2A4A]">Now</span>
<span class="material-symbols-outlined text-[#FFB238] text-[22px] my-1 material-symbols-fill" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
<span class="font-headline text-xs font-bold text-[#0F2A4A]">27°</span>
</div>
<!-- Pillar 2: 13:00 -->
<div class="py-2 px-1 flex flex-col items-center justify-between rounded-2xl hover:bg-white/20 transition duration-150">
<span class="font-label text-[11px] font-semibold text-[#4D6A8C]">13:00</span>
<span class="material-symbols-outlined text-[#FFB238] text-[22px] my-1 material-symbols-fill" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
<span class="font-headline text-xs font-bold text-[#0F2A4A]">28°</span>
</div>
<!-- Pillar 3: 14:00 -->
<div class="py-2 px-1 flex flex-col items-center justify-between rounded-2xl hover:bg-white/20 transition duration-150">
<span class="font-label text-[11px] font-semibold text-[#4D6A8C]">14:00</span>
<span class="material-symbols-outlined text-[#FFB238] text-[22px] my-1">partly_cloudy_day</span>
<span class="font-headline text-xs font-bold text-[#0F2A4A]">29°</span>
</div>
<!-- Pillar 4: 15:00 -->
<div class="py-2 px-1 flex flex-col items-center justify-between rounded-2xl hover:bg-white/20 transition duration-150">
<span class="font-label text-[11px] font-semibold text-[#4D6A8C]">15:00</span>
<span class="material-symbols-outlined text-white text-[22px] my-1 material-symbols-fill" style="font-variation-settings: 'FILL' 1;">cloud</span>
<span class="font-headline text-xs font-bold text-[#0F2A4A]">28°</span>
</div>
<!-- Pillar 5: 16:00 -->
<div class="py-2 px-1 flex flex-col items-center justify-between rounded-2xl hover:bg-white/20 transition duration-150">
<span class="font-label text-[11px] font-semibold text-[#4D6A8C]">16:00</span>
<span class="material-symbols-outlined text-[#337AB7] text-[22px] my-1">rainy</span>
<span class="font-headline text-xs font-bold text-[#0F2A4A]">26°</span>
</div>
</div>
</section>
<!-- 5. Floating Bottom Navigation Bar -->
<nav class="relative z-20 w-full flex justify-center pb-1">
<div class="glass-pill-nav w-full max-w-[310px] h-[58px] rounded-full px-3 py-1 flex items-center justify-around">
<!-- Tab 1: Home (Active with bright indicator) -->
<button aria-label="Home" class="flex items-center justify-center w-11 h-11 rounded-full bg-white/70 shadow-sm text-[#0F2A4A] transition-all duration-150 active:scale-95">
<span class="material-symbols-outlined text-[22px] material-symbols-fill" style="font-variation-settings: 'FILL' 1;">wb_sunny</span>
</button>
<!-- Tab 2: Forecast / Radar -->
<button aria-label="Forecast" class="flex items-center justify-center w-11 h-11 rounded-full text-[#0F2A4A]/60 hover:text-[#0F2A4A] active:scale-95 transition-colors duration-150">
<span class="material-symbols-outlined text-[22px]">map</span>
</button>
<!-- Tab 3: Air / Cities -->
<button aria-label="Air Quality" class="flex items-center justify-center w-11 h-11 rounded-full text-[#0F2A4A]/60 hover:text-[#0F2A4A] active:scale-95 transition-colors duration-150">
<span class="material-symbols-outlined text-[22px]">air</span>
</button>
<!-- Tab 4: Settings -->
<button aria-label="Settings" class="flex items-center justify-center w-11 h-11 rounded-full text-[#0F2A4A]/60 hover:text-[#0F2A4A] active:scale-95 transition-colors duration-150">
<span class="material-symbols-outlined text-[22px]">settings</span>
</button>
</div>
</nav>
</main>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;background:#0E0F12;font-family:Inter,sans-serif;overflow:hidden;color:#F5F5F0}
h1{position:absolute;top:48px;left:64px;font:800 44px 'Space Grotesk',sans-serif}
.sub{position:absolute;top:108px;left:64px;font:500 20px Inter;color:#A0A3B0;width:480px}
.bits{position:absolute;top:200px;left:64px;display:flex;flex-direction:column;gap:14px}
.bit{font:800 18px Inter;padding:14px 18px;border:3px solid #F5F5F0;box-shadow:4px 4px 0 #000;border-radius:8px;width:fit-content}
.ph{position:absolute;right:100px;top:60px;width:300px;height:600px;background:#000;border-radius:36px;padding:8px;border:3px solid #F5F5F0;box-shadow:8px 8px 0 #000}
.ph .s{width:100%;height:100%;border-radius:28px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<h1>Working rest timer<br>&amp; exercise checklist</h1>
<p class="sub">Pause, reset, mark sets done, complete the workout — streak bumps in localStorage.</p>
<div class="bits">
  <div class="bit" style="background:#FFE566;color:#111">⏱ Rest countdown</div>
  <div class="bit" style="background:#D4FF5E;color:#111">✓ Tap to complete sets</div>
  <div class="bit" style="background:#FF7AA2;color:#111">🔥 Streak on finish</div>
</div>
<div class="ph"><div class="s"><img src="shots/stitch-light-workout.png"></div></div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;background:#FFF8E7;font-family:Inter,sans-serif;overflow:hidden}
h1{position:absolute;top:48px;right:64px;text-align:right;font:800 44px 'Space Grotesk',sans-serif;width:520px}
.sub{position:absolute;top:160px;right:64px;text-align:right;font:500 20px Inter;color:#5A5A5A;width:480px}
.ph{position:absolute;left:100px;top:60px;width:300px;height:600px;background:#111;border-radius:36px;padding:8px;border:3px solid #111;box-shadow:8px 8px 0 #111}
.ph .s{width:100%;height:100%;border-radius:28px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<h1>Weekly bars,<br>PRs &amp; consistency</h1>
<p class="sub">Pure CSS geometric bars + calendar dots. No chart library required.</p>
<div class="ph"><div class="s"><img src="shots/stitch-dark-progress.png"></div></div>
</body></html>

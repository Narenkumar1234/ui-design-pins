<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:600px;height:600px;background:#FFF8E7;overflow:hidden;position:relative;font-family:Inter,sans-serif}
.card{position:absolute;left:40px;right:40px;top:40px;bottom:40px;background:#fff;border:5px solid #111;box-shadow:10px 10px 0 #111;border-radius:16px;padding:36px 28px;text-align:center}
.logo{width:72px;height:72px;background:#C8F542;border:4px solid #111;box-shadow:4px 4px 0 #111;border-radius:12px;margin:0 auto;display:flex;align-items:center;justify-content:center;font:800 36px 'Space Grotesk',sans-serif}
h1{font:800 48px/1.05 'Space Grotesk',sans-serif;margin-top:22px;letter-spacing:-1px}
.sub{font:600 18px Inter;color:#5A5A5A;margin-top:12px}
.row{margin-top:28px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.b{font:800 13px Inter;padding:8px 12px;border:3px solid #111;box-shadow:3px 3px 0 #111;border-radius:8px}
</style></head><body>
<div class="card">
  <div class="logo">P</div>
  <h1>Pulse Fit<br><span style="color:#FF5C8A">UI Kit</span></h1>
  <p class="sub">Neo-brutal fitness tracker<br>HTML + Tailwind + JS</p>
  <div class="row">
    <span class="b" style="background:#C8F542">Light + Dark</span>
    <span class="b" style="background:#FFE566">3 screens</span>
    <span class="b" style="background:#FF5C8A">$3 intro</span>
  </div>
</div>
</body></html>

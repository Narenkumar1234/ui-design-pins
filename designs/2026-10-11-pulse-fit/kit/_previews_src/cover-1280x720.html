<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;background:#FFF8E7;font-family:Inter,sans-serif;overflow:hidden;position:relative;color:#111}
.ph{position:absolute;background:#111;border-radius:36px;padding:8px;border:3px solid #111;box-shadow:8px 8px 0 #111}
.ph.dk{background:#000;border-color:#F5F5F0}
.ph .s{width:100%;height:100%;border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.ph img{display:block;width:100%;flex:1;min-height:0;object-fit:cover;object-position:top}
.pill{display:inline-block;font:800 15px Inter;letter-spacing:2px;text-transform:uppercase;padding:10px 16px;border:3px solid #111;box-shadow:4px 4px 0 #111;border-radius:8px;background:#C8F542}
.chip{display:inline-block;font:800 16px Inter;padding:8px 14px;border:3px solid #111;box-shadow:3px 3px 0 #111;border-radius:8px;background:#fff;margin:0 8px 8px 0}
</style></head><body>
<div style="position:absolute;right:0;top:0;width:520px;height:720px;background:#0E0F12"></div>
<div style="position:absolute;left:64px;top:80px;width:640px">
  <span class="pill">Front-end UI kit</span>
  <h1 style="font:800 78px/1.0 'Space Grotesk',sans-serif;letter-spacing:-2px;margin-top:22px">Pulse Fit<br><span style="color:#FF5C8A">UI Kit</span></h1>
  <p style="font:500 23px/1.45 Inter;color:#5A5A5A;margin-top:18px;width:560px">Neo-brutal fitness tracker: Today, Workout &amp; Progress — light &amp; dark, with a working streak and rest timer.</p>
  <div style="margin-top:26px">
    <span class="chip" style="background:#C8F542">6 screens</span>
    <span class="chip" style="background:#FFE566">Light + Dark</span>
    <span class="chip" style="background:#4D7CFE;color:#fff">HTML + Tailwind</span>
    <span class="chip" style="background:#FF5C8A">Rest timer</span>
  </div>
  <p style="font:800 24px 'Space Grotesk',sans-serif;margin-top:36px;color:#111">@code.in.30s</p>
</div>
<div class="ph" style="left:730px;top:90px;width:230px;height:510px;z-index:2"><div class="s"><img src="shots/mobile-light-today.png"></div></div>
<div class="ph dk" style="left:960px;top:50px;width:250px;height:555px;z-index:3;box-shadow:8px 8px 0 #000"><div class="s"><img src="shots/stitch-dark-today.png"></div></div>
</body></html>

<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1280px;height:720px;background:#FFF8E7;font-family:Inter,sans-serif;overflow:hidden;position:relative}
h1{position:absolute;top:40px;left:0;right:0;text-align:center;font:800 42px 'Space Grotesk',sans-serif}
.sub{position:absolute;top:96px;left:0;right:0;text-align:center;font:600 20px Inter;color:#5A5A5A}
.ph{position:absolute;background:#111;border-radius:32px;padding:7px;border:3px solid #111;box-shadow:6px 6px 0 #111}
.ph.dk{background:#000;box-shadow:6px 6px 0 #000}
.ph .s{width:100%;height:100%;border-radius:25px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.lbl{position:absolute;font:800 16px Inter;padding:8px 14px;border:3px solid #111;box-shadow:3px 3px 0 #111;border-radius:8px}
</style></head><body>
<h1>Light <span style="color:#C8F542">vs</span> Dark</h1>
<p class="sub">Same neo-brutal system — cream day / charcoal night</p>
<div class="ph" style="left:180px;top:150px;width:280px;height:520px"><div class="s"><img src="shots/stitch-light-today.png"></div></div>
<span class="lbl" style="left:250px;top:680px;background:#C8F542">Light · Today</span>
<div class="ph dk" style="left:720px;top:150px;width:280px;height:520px"><div class="s"><img src="shots/stitch-dark-today.png"></div></div>
<span class="lbl" style="left:790px;top:680px;background:#D4FF5E;color:#0E0F12">Dark · Today</span>
</body></html>

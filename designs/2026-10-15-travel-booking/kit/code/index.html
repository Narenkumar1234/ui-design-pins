<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2728%27 fill=%27%233B8CF5%27/%3E%3Cpath d=%27M24 52 76 28 54 80 48 58Z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Roam · Explore the world</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <div class="wash" aria-hidden="true"></div>
  <main class="relative z-10 max-w-md md:max-w-3xl mx-auto px-5 pt-6 pb-32">
    <!-- Header: avatar + greeting · location pill + theme toggle -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="relative">
          <img src="img/avatar.jpg" alt="Aria" class="w-11 h-11 rounded-full object-cover object-top ring-2 ring-white/80 shadow-soft">
          <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-accent border-2 border-bg"></span>
        </span>
        <div><p class="font-semibold leading-tight">Hi, Aria</p><p class="text-xs text-muted">Where to next?</p></div>
      </div>
      <div class="flex items-center gap-2">
        <span class="surface rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5 shadow-soft"><svg class="icon fill text-accent text-[13px]"><use href="#i-nav"/></svg>Bali, Indonesia</span>
        <button type="button" data-theme-toggle class="surface w-9 h-9 rounded-full grid place-items-center shadow-soft" aria-label="Toggle dark mode"></button>
      </div>
    </header>

    <h1 class="mt-5 text-[32px] md:text-5xl leading-[1.12] font-extrabold tracking-tight">Explore the<br>world</h1>

    <!-- Search pill -->
    <form id="search-form" role="search" class="mt-5 flex items-center gap-2.5 surface rounded-full pl-4 pr-1.5 py-1.5 shadow-soft focus-within:ring-2 focus-within:ring-accent/40">
      <svg class="icon text-muted text-[18px]"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search destinations" aria-label="Search destinations" class="flex-1 bg-transparent outline-none text-sm font-medium placeholder:text-muted py-2">
      <button id="sort" type="button" class="w-9 h-9 rounded-full bg-accent/10 text-accent grid place-items-center hover:bg-accent hover:text-white transition" aria-label="Sort destinations"><svg class="icon text-[17px]"><use href="#i-sliders"/></svg></button>
    </form>

    <!-- Category chips -->
    <div id="chips" class="mt-5 -mx-5 px-5 flex gap-2.5 overflow-x-auto no-scrollbar py-1" role="toolbar" aria-label="Categories">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="popular" aria-pressed="false">Popular</button>
      <button type="button" class="chip" data-filter="recommended" aria-pressed="false">Recommended</button>
      <button type="button" class="chip" data-filter="most" aria-pressed="false">Most visited</button>
    </div>

    <!-- Featured: tall photo cards with frosted glass pills -->
    <section class="mt-6" aria-labelledby="featured-h">
      <div class="flex items-center justify-between mb-3.5">
        <h2 id="featured-h" class="text-lg font-bold tracking-tight">Featured places</h2>
        <a href="explore.html" class="text-xs font-semibold text-accent hover:underline">Explore</a>
      </div>
      <div id="featured" class="-mx-5 px-5 flex gap-4 overflow-x-auto no-scrollbar snap-x snap-mandatory pb-2 md:mx-0 md:px-0 md:grid md:grid-cols-3 md:overflow-visible"></div>
      <p id="empty" hidden class="text-sm text-muted text-center py-10">No places match that search. Try "Italy" or "beach".</p>
    </section>

    <!-- Popular trips list -->
    <section id="popular-wrap" class="mt-6" aria-labelledby="popular-h">
      <div class="flex items-center justify-between mb-3">
        <h2 id="popular-h" class="text-lg font-bold tracking-tight">Popular trips</h2>
        <a href="explore.html" class="text-xs font-semibold text-accent hover:underline">See all</a>
      </div>
      <ul id="popular" class="grid gap-2.5 md:grid-cols-2"></ul>
    </section>
  </main>

  <nav id="tabbar" data-active="home"></nav>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>

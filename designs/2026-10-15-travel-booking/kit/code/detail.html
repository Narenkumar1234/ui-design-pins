<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2728%27 fill=%27%233B8CF5%27/%3E%3Cpath d=%27M24 52 76 28 54 80 48 58Z%27 fill=%27white%27/%3E%3C/svg%3E">
  <title>Roam · Destination</title>
</head>
<body class="bg-bg text-ink antialiased min-h-screen">
  <div class="wash" aria-hidden="true"></div>
  <main class="relative z-10 max-w-md md:max-w-5xl mx-auto pb-36 md:grid md:grid-cols-2 md:gap-10 md:px-6 md:pt-6">
    <!-- Hero photo with frosted controls -->
    <section class="relative h-[340px] md:h-[620px] md:sticky md:top-6 rounded-b-hero md:rounded-hero overflow-hidden shadow-card">
      <img id="hero" src="img/braies.jpg" alt="" class="absolute inset-0 w-full h-full object-cover">
      <div class="absolute inset-0 bg-gradient-to-b from-black/25 via-transparent to-black/35"></div>
      <div class="absolute top-4 inset-x-4 flex items-center justify-between">
        <button id="back" type="button" class="glass w-11 h-11 rounded-full grid place-items-center" aria-label="Back"><svg class="icon text-[22px]"><use href="#i-chevron-left"/></svg></button>
        <div class="flex gap-2">
          <button id="share" type="button" class="glass w-11 h-11 rounded-full grid place-items-center" aria-label="Share"><svg class="icon text-[18px]"><use href="#i-share"/></svg></button>
          <button id="like" type="button" class="like glass w-11 h-11 rounded-full grid place-items-center" data-like="braies" aria-pressed="false" aria-label="Save"><svg class="icon text-[19px]"><use href="#i-heart"/></svg></button>
        </div>
      </div>
      <div class="absolute bottom-4 inset-x-4 flex items-end justify-between gap-3">
        <span class="glass rounded-full px-3 py-1.5 text-xs font-semibold flex items-center gap-1.5"><svg class="icon text-[14px]"><use href="#i-mountain"/></svg><span id="badge">Alpine retreat</span></span>
        <div id="thumbs" class="glass rounded-2xl p-1.5 flex gap-1.5"></div>
      </div>
    </section>

    <div class="px-5 md:px-0 pt-6">
      <div class="flex items-start justify-between gap-3">
        <h1 id="name" class="text-[28px] md:text-4xl font-extrabold tracking-tight leading-tight">Lago di Braies</h1>
        <span id="incl" class="mt-1.5 flex-none rounded-full bg-soft text-accent border border-accent/20 px-3 py-1 text-xs font-semibold">All-Inclusive</span>
      </div>
      <p class="mt-1 flex items-center gap-1.5 text-muted"><svg class="icon text-accent text-[16px]"><use href="#i-pin"/></svg><span id="country">Dolomites, Italy</span></p>
      <div class="mt-4 flex flex-wrap gap-2 text-xs">
        <span class="surface rounded-full px-3 py-1.5 flex items-center gap-1.5"><svg class="icon fill text-gold text-[14px]"><use href="#i-star"/></svg><b id="rating">4.9</b><span id="reviews" class="text-muted">(1.2k reviews)</span></span>
        <span class="surface rounded-full px-3 py-1.5 flex items-center gap-1.5"><svg class="icon text-muted text-[14px]"><use href="#i-clock"/></svg><span id="days">5 days</span></span>
        <span class="rounded-full bg-soft text-accent px-3 py-1.5 flex items-center gap-1.5 font-semibold"><svg class="icon text-[14px]"><use href="#i-shield"/></svg>Free cancellation</span>
      </div>

      <h2 class="mt-7 font-bold text-lg tracking-tight">Top Facilities</h2>
      <ul id="facilities" class="mt-3 grid grid-cols-4 gap-2.5"></ul>

      <h2 class="mt-7 font-bold text-lg tracking-tight">Description</h2>
      <p id="about" class="mt-2 text-sm leading-relaxed text-muted line-clamp-3"></p>
      <button id="more" type="button" class="mt-1.5 text-sm font-semibold text-accent" aria-expanded="false" aria-controls="about">Read more <span aria-hidden="true">›</span></button>
    </div>
  </main>

  <!-- Sticky price + Book bar -->
  <div class="fixed bottom-0 inset-x-0 z-40">
    <div class="max-w-md md:max-w-5xl mx-auto surface md:rounded-t-[24px] border-b-0 px-5 pt-4 pb-6 flex items-center justify-between gap-4 shadow-[0_-12px_30px_-18px_rgb(16_28_44/.35)]">
      <div><p class="text-[11px] uppercase tracking-wider text-muted font-semibold">Total price</p>
        <p><b id="price" class="text-2xl font-extrabold">$1,250</b><span class="text-xs text-muted"> / person</span></p></div>
      <button id="book" type="button" class="grad rounded-full px-7 py-3.5 font-bold flex items-center gap-2 hover:brightness-105 active:scale-[.98] transition">Book Now <svg class="icon text-[18px]"><use href="#i-arrow-right"/></svg></button>
    </div>
  </div>

  <!-- Booking bottom sheet -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <form id="sheet-form" class="p-6">
      <div class="mx-auto w-10 h-1.5 rounded-full bg-line md:hidden"></div>
      <div class="flex items-center justify-between mt-3">
        <h3 id="sheet-title" class="text-lg font-bold">Book trip</h3>
        <button id="sheet-close" type="button" class="w-9 h-9 rounded-full bg-soft grid place-items-center" aria-label="Close"><svg class="icon text-[16px]"><use href="#i-x"/></svg></button>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-5">
        <label class="text-xs font-semibold text-muted">Check-in<input id="from" type="date" required class="mt-1.5 w-full rounded-2xl bg-soft border border-line px-3 py-2.5 text-sm text-ink font-medium outline-none focus:ring-2 focus:ring-accent/40"></label>
        <label class="text-xs font-semibold text-muted">Check-out<input id="to" type="date" required class="mt-1.5 w-full rounded-2xl bg-soft border border-line px-3 py-2.5 text-sm text-ink font-medium outline-none focus:ring-2 focus:ring-accent/40"></label>
      </div>
      <div class="mt-4 flex items-center justify-between rounded-2xl bg-soft border border-line px-4 py-3">
        <div><p class="text-sm font-semibold">Guests</p><p class="text-xs text-muted">Ages 13 or above</p></div>
        <div class="flex items-center gap-3">
          <button id="g-minus" type="button" class="w-9 h-9 rounded-full bg-card border border-line grid place-items-center disabled:opacity-40" aria-label="Fewer guests"><svg class="icon text-[16px]"><use href="#i-minus"/></svg></button>
          <span id="g-count" class="w-5 text-center font-bold" aria-live="polite">2</span>
          <button id="g-plus" type="button" class="w-9 h-9 rounded-full bg-card border border-line grid place-items-center" aria-label="More guests"><svg class="icon text-[16px]"><use href="#i-plus"/></svg></button>
        </div>
      </div>
      <div class="mt-5 flex items-center justify-between">
        <p class="text-sm text-muted">Total</p><p id="g-total" class="text-2xl font-extrabold">$2,500</p>
      </div>
      <button type="submit" class="grad mt-5 w-full rounded-full py-3.5 font-bold flex items-center justify-center gap-2">Confirm booking <svg class="icon text-[18px]"><use href="#i-check"/></svg></button>
    </form>
  </dialog>
  <script src="assets/icons.js"></script>
  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/detail.js"></script>
</body>
</html>
